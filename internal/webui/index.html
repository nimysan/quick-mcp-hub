<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcp-hub · 渠道管理</title>
<!-- 没有这一行，Chromium 的 --app 窗口在任务栏里显示的是一个地球图标 -->
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280;
    --border:#e3e6ea; --accent:#2f6fed; --accent-fg:#fff;
    --ok:#1a7f45; --ok-bg:#e7f5ec; --danger:#c0362c; --danger-bg:#fbeae8;
    --warn:#9a6700; --warn-bg:#fff6e0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17191c; --card:#22262b; --text:#e6e8ea; --muted:#9aa2ab;
      --border:#343a41; --accent:#5b8def; --accent-fg:#0b0c0e;
      --ok:#58c98a; --ok-bg:#16301f; --danger:#f0776b; --danger-bg:#2e1715;
      --warn:#e0b049; --warn-bg:#2d2512;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:14px 20px;background:var(--card);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px}
  header .brand{font-weight:600}
  header .tag{font-size:11px;padding:2px 7px;border-radius:5px;
    background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
  header .right{margin-left:auto;font-size:12px;color:var(--muted)}
  main{max-width:900px;margin:0 auto;padding:20px}
  .sec{margin-bottom:28px}
  .sec.market{padding-top:20px;border-top:1px solid var(--border)}
  .hint-inline{margin-left:auto;font-size:12px;color:var(--muted)}
  .row{display:flex;align-items:center;margin-bottom:14px}
  .row h2{font-size:15px;margin:0}
  .row .count{font-size:12px;color:var(--muted);font-weight:normal;margin-left:6px}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--border);
    background:var(--card);color:var(--text);padding:6px 12px}
  button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.link{border:none;background:none;color:var(--muted);padding:4px 6px}
  button.link.danger{color:var(--danger)}
  .empty{text-align:center;padding:48px 20px;background:var(--card);
    border:1px solid var(--border);border-radius:12px}
  .empty .ico{font-size:30px;opacity:.6}
  .empty .t{font-weight:600;margin:8px 0 4px}
  .empty .s{color:var(--muted);font-size:13px;margin-bottom:16px}
  .chan{display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .chan .ico{font-size:20px}
  .chan .meta{flex:1;min-width:0}
  .chan .meta .name{font-weight:600}
  .chan .meta .sub{font-size:12px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.bad{background:var(--danger-bg);color:var(--danger)}
  .pill.off{background:var(--warn-bg);color:var(--warn)}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .mask.show{display:flex}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:520px;padding:20px}
  .modal h3{margin:0 0 4px}
  .modal .hint{color:var(--muted);font-size:12px;margin-bottom:14px}
  .oauth-box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:4px 0 14px}
  /* lead：这个渠道的正路就是点按钮授权，所以它要比表单显眼。
     不这样排的话，用户先看到的是两个输入框，会以为需要手动填。 */
  .oauth-box.lead{border-color:var(--accent);border-width:1.5px;padding:16px}
  .oauth-box.lead button{font-size:15px;padding:10px 20px;margin-top:10px}
  .risk{border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin:4px 0 14px}
  .tp{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--warn);
      color:var(--warn);white-space:nowrap}
  .oauth-head{font-weight:600;font-size:13px;margin-bottom:6px}
  .oauth-code{margin-top:10px}
  .code-row{display:flex;align-items:center;gap:10px;margin-top:4px}
  .code-row code{font-size:20px;letter-spacing:2px;font-weight:700;
    padding:6px 12px;border:1px dashed var(--border);border-radius:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
  .mk{background:var(--card);border:1px solid var(--border);border-radius:10px;
      padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .mk.has{border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
  .mk.soon{opacity:.5}
  .mk .top{display:flex;align-items:center;gap:7px}
  /* 名字吃掉剩余宽度、id 角标不压缩。原来三者在一行里互相挤，长名字会被
     压断在词中间（出现过「GitHub（wasm 插」/「件)」这种断行）。 */
  .mk .nm{font-weight:600;flex:1;min-width:0}
  .mk .top code{flex:none}
  /* 风险徽标单独一行：和名字挤在一行时它自己也会断成两行（「第三方扩」/
     「展」），而且把标题挤成三行高。 */
  .mk .tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .mk .sm{font-size:12px;color:var(--muted);flex:1}
  /* tl 是给「工具名清单」那种一行等宽文本用的，截断是刻意的。整句提示
     要用 note：正常字体、正常换行 —— 把一句话截掉会正好吃掉重点那半句
     （「…要你在表单里另外打」）。 */
  .mk .tl{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mk .note{font-size:11px;line-height:1.5}
  .mk .act{display:flex;align-items:center;gap:8px;margin-top:2px}
  .mk .act .mine{font-size:11px;color:var(--ok);margin-right:auto}
  .mk button{padding:4px 10px;font-size:12px}
  .ptype{border:1px solid var(--border);border-radius:9px;padding:10px;cursor:pointer}
  .ptype.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .ptype.off{opacity:.45;cursor:not-allowed}
  .ptype .n{font-weight:600}
  .ptype .s code{font-size:10px;color:var(--muted)}
  .ver{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;vertical-align:1px;
       color:var(--muted);background:var(--border)}
  .tagbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .tg{font-size:11px;padding:3px 9px;border-radius:12px;cursor:pointer;
      border:1px solid var(--border);color:var(--muted);user-select:none}
  .tg.on{border-color:var(--accent);color:var(--accent);font-weight:600;
         background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .ptype .s{font-size:11px;color:var(--muted);margin-top:2px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
  .field .secret-tag{font-weight:400;font-size:10px;padding:1px 6px;border-radius:4px;
    background:var(--warn-bg);color:var(--warn);margin-left:6px}
  .field input[type=text],.field input[type=password],.field input[type=number]{
    width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;
    background:var(--bg);color:var(--text);font:inherit}
  .field .help{font-size:11px;color:var(--muted);margin-top:4px}
  .field.check{display:flex;align-items:center;gap:8px}
  .field.check label{margin:0}
  .adv-toggle{font-size:12px;color:var(--accent);cursor:pointer;margin:6px 0 12px}
  .adv{display:none} .adv.show{display:block}
  .foot{display:flex;align-items:center;gap:8px;margin-top:8px;
    padding-top:14px;border-top:1px solid var(--border)}
  .foot .status{margin-left:auto;font-size:12px}
  .status.ok{color:var(--ok)} .status.bad{color:var(--danger)}
  /* 这两条原先只在 .field / .foot 下生效，所以 oauth-box 和自动配置面板里
     的说明文字是裸的默认样式。提成全局，值和原来一致。 */
  .help{font-size:11px;color:var(--muted);margin-top:4px}
  .ncl{font-size:12px;margin-top:5px;line-height:1.5}
  .ob-steps{font-size:13px;line-height:1.7}
  .ob-json{background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;font-size:12px;font-family:ui-monospace,monospace;
    white-space:pre;overflow-x:auto;margin:8px 0}
  .ob-act{display:flex;align-items:center;gap:8px}
  .loglink{font-size:11px;color:var(--muted);margin-left:10px;text-decoration:none;
    border:1px solid var(--border);border-radius:5px;padding:2px 7px}
  .loglink:hover{color:var(--text)}
  .field select{width:100%;padding:7px 9px;border:1px solid var(--border);
    border-radius:7px;background:var(--bg);color:var(--text);font:inherit}
  code{background:color-mix(in srgb,var(--text) 8%,transparent);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <span class="brand">mcp-hub</span>
  <span class="tag" id="ver"></span>
  <span class="right" id="cfgpath"></span>
  <a class="loglink" id="loglink" href="/api/log" target="_blank" rel="noreferrer" hidden>查看日志</a>
</header>
<main>
  <section class="sec">
    <div class="row">
      <h2>🔌 已集成渠道 <span class="count" id="count"></span></h2>
      <div class="hint-inline" id="toolsum"></div>
    </div>
    <div id="list"></div>
  </section>

  <section class="sec market">
    <div class="row">
      <h2>🏪 渠道市场</h2>
      <div class="hint-inline" id="srcinfo"></div>
    </div>
    <div class="tagbar" id="tagbar"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="sec">
    <div class="row">
      <h2>🔗 接入 AI 客户端</h2>
      <div class="hint-inline">配好渠道之后，还要让客户端认识这个程序</div>
    </div>
    <div id="onboard"></div>
  </section>
</main>

<div class="mask" id="mask">
  <div class="modal" id="modal"></div>
</div>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const api = async (url,opt)=>{const r=await fetch(url,opt);return r.json()};
let DESCRIPTORS=[], CFGPATH="";

async function boot(){
  const d = await api("/api/descriptors");
  DESCRIPTORS = d.descriptors; CFGPATH = d.configPath;
  $("#ver").textContent = d.version;
  $("#cfgpath").textContent = "配置：" + d.configPath;
  if(d.logPath){ const l=$("#loglink"); l.hidden=false; l.title="日志文件："+d.logPath; }
  EXEPATH = d.exePath || "";
  renderOnboard();
  $("#srcinfo").textContent = `${DESCRIPTORS.filter(x=>x.available).length} 个可用 · 内置目录`;
  await refresh();
}

// TAG_LABELS 把标签翻成中文显示；没列到的标签原样显示，
// 这样下发的目录带来新分类时页面不用跟着改。
const TAG_LABELS = {email:"邮件", erp:"ERP", finance:"财务", devtools:"开发",
                    project:"项目", im:"协作", crm:"客户", hr:"人事",
                    storage:"存储", other:"其他"};
const tagText = t => TAG_LABELS[t] || t;

let CHANNELS = [];

// activeTools 算出一条实例真正注册给客户端的工具。写开关关着时，写类工具
// 根本不会注册 —— 页面上的数字必须和客户端看到的一致，否则用户会以为
// 工具没生效是 hub 的问题。
function activeTools(v){
  const d=v.descriptor, all=d.tools||[], w=d.writeTools||[];
  if(!w.length) return {on:all, off:[]};
  const sw = d.writeSwitch ? v.instance.settings?.[d.writeSwitch] : null;
  if(sw==="true"||sw===true) return {on:all, off:[]};
  return {on:all.filter(t=>!w.includes(t)), off:w};
}
let TAG = "";   // 市场的分类筛选，空串 = 全部

async function refresh(){
  const {channels=[]} = await api("/api/channels");
  CHANNELS = channels;
  renderMine();
  renderMarket();
}

// ---------- 已集成渠道 ----------
function renderMine(){
  $("#count").textContent = CHANNELS.length ? CHANNELS.length+" 个" : "";
  const on = new Set(), off = new Set();
  CHANNELS.forEach(v => {
    const a = activeTools(v);
    a.on.forEach(t=>on.add(t)); a.off.forEach(t=>off.add(t));
  });
  $("#toolsum").textContent = on.size
    ? `注册 ${on.size} 个工具给客户端` + (off.size?`，${off.size} 个因开关关闭未注册`:"")
    : "";

  const list = $("#list");
  if(!CHANNELS.length){
    list.innerHTML = `<div class="empty">
      <div class="ico">📭</div><div class="t">还没有集成任何渠道</div>
      <div class="s">在下面的渠道市场里挑一个，填上账号就能用</div></div>`;
    return;
  }
  list.innerHTML = CHANNELS.map((v,idx)=>{
    const d=v.descriptor, i=v.instance;
    const pill = !v.hasSecret ? `<span class="pill bad">● 缺少凭据</span>`
      : !i.enabled ? `<span class="pill off">● 已停用</span>`
      : `<span class="pill ok">● 已配置</span>`;
    const a = activeTools(v);
    const tools = a.on.join(" / ") + (a.off.length?`　（${a.off.join(" / ")} 未启用）`:"");
    // 按钮不写内联 onclick：拼进 HTML 属性的参数一旦含引号就会把属性截断，
    // 结果是按钮静默失效（点了什么都不发生）。统一在下面挂闭包。
    return `<div class="chan">
      <span class="ico">${d.icon||"🔌"}</span>
      <div class="meta">
        <div class="name">${esc(d.name)} · ${esc(i.account)}</div>
        <div class="sub">${tools?("工具 "+esc(tools)):""}</div>
      </div>
      ${pill}
      <button class="link" data-act="test" data-i="${idx}">测试</button>
      <button class="link" data-act="edit" data-i="${idx}">编辑</button>
      <button class="link danger" data-act="del" data-i="${idx}">删除</button>
    </div>`;
  }).join("");

  list.querySelectorAll("button[data-act]").forEach(btn=>{
    const v = CHANNELS[+btn.dataset.i];
    const type = v.descriptor.type, account = v.instance.account;
    btn.onclick = () => ({test:testSaved, edit:openEdit, del:del})[btn.dataset.act](type, account);
  });
}

// ---------- 渠道市场 ----------
let EXEPATH = "";

// 接入 AI 客户端：把配置连同**运行时探测到的**本程序路径一起给出来。
//
// 为什么不是一个按钮：Amazon Quick 的本地连接器配置存在它自己的应用里
// （Electron 的浏览器存储），磁盘上没有 MCP 配置文件，所以没有东西可写。
// Claude Desktop / Cursor 这类读 JSON 文件的客户端理论上可以代写，但那是
// 另一件事，不在这里混着做。
//
// 路径必须运行时探测，不能写死安装目录：用户可能跑的是解压出来的绿色版。
// 给错路径的后果是客户端报 not found on PATH，而他完全看不出哪里错了。
function renderOnboard(){
  const cfg = JSON.stringify(
    {mcpServers:{"mcp-hub":{command:EXEPATH,args:["-serve"]}}}, null, 2);
  $("#onboard").innerHTML = `
    <div class="ob-steps">
      <b>Amazon Quick</b>：Customize → Connectors → <b>Add Local Connector</b> → 选 Local →
      把下面这段粘进去 → <b>Test Connection</b> 通了再点 <b>Add</b>。添加完点一次 <b>Sync</b>。
    </div>
    <div class="help">这一步没法自动完成：Quick 把连接器配置存在它自己的应用里，不是磁盘上的文件。</div>
    <pre class="ob-json">${esc(cfg)}</pre>
    <div class="ob-act">
      <button class="primary" id="obcopy">复制这段 JSON</button>
      <button id="obcopypath">只复制路径</button>
      <span class="status" id="obst"></span>
    </div>
    <div class="help">如果 Quick 给的是 Command / Arguments 两个输入框，就用「只复制路径」填 Command，
      Arguments 填 <code>-serve</code>。JSON 里反斜杠是两道、表单里是一道，两个按钮已经各自处理好。</div>
    <div class="help">本程序在：<code>${esc(EXEPATH||"（探测不到）")}</code>
      · 换了位置就回这里重新复制一次</div>`;
  $("#obcopy").onclick = () => copyText(cfg, "JSON 已复制");
  $("#obcopypath").onclick = () => copyText(EXEPATH, "路径已复制");
}

async function copyText(text, okMsg){
  const st = $("#obst");
  try{
    await navigator.clipboard.writeText(text);
    st.className = "status ok"; st.textContent = okMsg;
  }catch(e){
    // 复制失败时别只说失败 —— 告诉他还能怎么办。
    st.className = "status bad"; st.textContent = "复制不了，请手工选中上面那段";
  }
  setTimeout(()=>{ st.textContent = ""; }, 3000);
}

function renderMarket(){
  const allTags = [...new Set(DESCRIPTORS.flatMap(d=>d.tags||[]))].sort();
  $("#tagbar").innerHTML =
    `<span class="tg ${TAG?'':'on'}" data-tag="">全部 ${DESCRIPTORS.length}</span>` +
    allTags.map(t=>{
      const n = DESCRIPTORS.filter(d=>(d.tags||[]).includes(t)).length;
      return `<span class="tg ${TAG===t?'on':''}" data-tag="${esc(t)}">${esc(tagText(t))} ${n}</span>`;
    }).join("");
  $("#tagbar").querySelectorAll("[data-tag]").forEach(el=>{
    el.onclick = () => { TAG = el.dataset.tag; renderMarket(); };
  });

  const list = TAG ? DESCRIPTORS.filter(d=>(d.tags||[]).includes(TAG)) : DESCRIPTORS;
  // 同一个渠道可以配多个账号，所以这里统计的是实例数而不是「有没有」
  const mine = t => CHANNELS.filter(v=>v.descriptor.type===t).length;

  $("#grid").innerHTML = list.map((d,idx)=>{
    const n = mine(d.type);
    const cls = !d.available ? "soon" : (n ? "has" : "");
    const wn = (d.writeTools||[]).length;
    // 卡片上只放用户能据以决定的事。刻意不放的三样：
    //
    //   - 「复核」：那是我们发布声明时的内部状态（postReads 的信号），
    //     对用户不构成任何可做的决定。机制还在，只是不摆在这里。
    //   - 工具名清单：list_recent search_mail read_mail… 截断成一行
    //     snake_case，对业务人员等于乱码；summary 已经用人话说了它能干什么。
    //   - 工具个数：数字不帮人决定要不要加这个渠道。
    //
    // 留下的两条标记是真风险（会在你机器上跑别人的代码 / 要你另外装一个
    // 程序），它们改变用户要做的事，所以必须看得见。
    return `<div class="mk ${cls}">
      <div class="top">
        <span>${d.icon||"🔌"}</span>
        <span class="nm">${esc(d.name)}</span>
        <code>${esc(d.type)}</code>
      </div>
      ${(d.version||d.thirdPartyCode||d.localProgram)?`<div class="tags">
        ${d.version?`<span class="ver">v${d.version}</span>`:''}
        ${d.thirdPartyCode?'<span class="tp" title="这个渠道的代码不是本程序写的，它跑在隔离环境里，不能读你的文件和密码">🧩 第三方扩展</span>':''}
        ${d.localProgram?'<span class="tp" title="这个渠道连的是你自己机器上另一个程序，要先装好它">💻 需本机程序</span>':''}
      </div>`:''}
      <div class="sm">${esc(d.summary)}</div>
      ${d.thirdPartyCode?`<div class="note" style="color:var(--warn)">它只能访问：${esc((d.allowedHosts||[]).join(" "))}</div>`:''}
      ${d.localProgram?`<div class="note" style="color:var(--warn)">要先在这台机器上装好并运行那个程序，填完表单不会自己装</div>`:''}
      ${wn?`<div class="note" style="color:var(--warn)">默认只读。发送、修改类操作要你在表单里另外打开</div>`:''}
      <div class="act">
        ${n?`<span class="mine">✓ 已连接 ${n} 个账号</span>`:'<span class="mine"></span>'}
        ${d.available
          ? `<button class="${n?'':'primary'}" data-add="${idx}">${n?'再加一个账号':'添加'}</button>`
          : '<button disabled>暂未支持</button>'}
      </div>
    </div>`;
  }).join("");

  $("#grid").querySelectorAll("[data-add]").forEach(btn=>{
    const d = list[+btn.dataset.add];
    btn.onclick = () => openForm(d.type, null);
  });
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function close(){
  $("#mask").classList.remove("show");
  // 关弹窗就放弃正在进行的授权：服务端那个轮询协程不该在没人看的时候
  // 继续打授权服务。
  if(OAUTH_SESSION){
    const id = OAUTH_SESSION; OAUTH_SESSION = null;
    api("/api/oauth/cancel",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session:id})}).catch(()=>{});
  }
}

function openEdit(type,account){openForm(type,account)}

async function openForm(type, account){
  const d = DESCRIPTORS.find(x=>x.type===type);
  let inst=null;
  if(account){
    const {channels=[]} = await api("/api/channels");
    inst = channels.find(v=>v.descriptor.type===type && v.instance.account===account)?.instance;
  }
  const val=(f)=> inst ? (f.name===d.accountField?inst.account:(inst.settings?.[f.name]??f.default)) : f.default;
  const basic = d.fields.filter(f=>!f.advanced);
  const adv   = d.fields.filter(f=>f.advanced);
  const fieldHTML=(f)=>{
    const v = val(f)||"";
    if(f.kind==="bool"){
      const on=(v==="true"||v===true);
      return `<div class="field check"><input type="checkbox" id="f_${f.name}" ${on?"checked":""}>
        <label for="f_${f.name}">${f.label}</label></div>
        ${f.help?`<div class="help" style="margin:-8px 0 12px 26px">${esc(f.help)}</div>`:""}`;
    }
    const tag = f.kind==="password"?`<span class="secret-tag">🔑 密码类</span>`:"";
    const ph = f.kind==="password"&&account?"（留空表示不修改）":(f.placeholder||"");
    const type = f.kind==="password"?"password":(f.kind==="number"?"number":"text");
    return `<div class="field"><label>${f.label}${f.required?' <span style="color:var(--danger)">*</span>':""}${tag}</label>
      <input type="${type}" id="f_${f.name}" value="${f.kind==="password"?"":esc(v)}" placeholder="${esc(ph)}">
      ${f.help?`<div class="help">${esc(f.help)}</div>`:""}</div>`;
  };
  // 账号字段编辑时锁定（它是凭据键的一部分）
  //
  // oauthFirst：这个渠道不需要用户先填任何东西就能授权（没有 clientIdField），
  // 那么正路就是点按钮，输入框是给「扫不了码」的少数人留的后路。所以把按钮
  // 排在最前、做成主按钮，把姓名和令牌收到折叠里 —— 先摆两个输入框，所有人
  // 都会以为需要手动填。
  //
  // GitHub 那种有 clientIdField 的不走这条：它必须先填 Client ID 才能连，
  // 把那个框折起来等于让按钮点了就报错。
  const oauthFirst = !!(d.oauth && !account && !d.oauth.clientIdField);
  const credNames = [d.accountField, d.secretField].filter(Boolean);
  const credFields = oauthFirst ? basic.filter(f=>credNames.includes(f.name)) : [];
  const formFields = oauthFirst ? basic.filter(f=>!credNames.includes(f.name)) : basic;
  const oauthHTML = (d.oauth && !account) ? `
    <div class="oauth-box${oauthFirst?" lead":""}">
      <div class="oauth-head">🔗 ${oauthFirst?`扫码连接，不用手工生成令牌`:`用 OAuth 连接（不用手工生成令牌）`}</div>
      <div class="help">点下面的按钮，会把你送到 <b>${esc(d.oauth.authHost)}</b> 授权${
        d.oauth.scopes?.length?`，申请的权限：<code>${esc(d.oauth.scopes.join(" "))}</code>`:""}</div>
      ${d.oauth.help?`<div class="help">${esc(d.oauth.help)}${
        d.oauth.setupUrl?` · <a href="${esc(d.oauth.setupUrl)}" target="_blank" rel="noreferrer">去注册</a>`:""}</div>`:""}
      <button class="${oauthFirst?"primary":""}" id="oauthbtn" style="margin-top:8px">连接${esc(d.name)}</button>
      <div id="oauthpanel"></div>
    </div>` : "";
  // 手动填的后路：默认收起。里面放的是凭据字段，所以「只存进密码管理器」
  // 那句提示也跟着挪进来 —— 折起来的时候它在上面只是噪音。
  const manualHTML = credFields.length ? `
    <div class="adv-toggle" id="manualtoggle">▸ 扫不了码？手动填${esc(credFields.map(f=>f.label).join("和"))}</div>
    <div class="adv" id="manual">
      <div class="hint">密码类字段只存进系统密码管理器，不写配置文件、不进日志</div>
      ${credFields.map(fieldHTML).join("")}
    </div>` : "";
  const riskHTML = d.thirdPartyCode ? `
    <div class="risk">
      <div class="oauth-head">🧩 这个渠道会在你的机器上执行第三方代码</div>
      <div class="help">代码跑在 wasm 沙箱里：没有文件、没有钥匙串、不能连任意地址。
        它只能访问 <b>${esc((d.allowedHosts||[]).join(" "))}</b>，
        凭据由本程序注入请求头，插件代码看不到你的令牌。</div>
      ${(d.writeTools||[]).length?`<div class="help" style="color:var(--warn)">其中 ${(d.writeTools||[]).length} 个写操作，写开关关着时不会注册给模型</div>`:''}
    </div>` : "";
  const localHTML = d.localProgram ? `
    <div class="risk">
      <div class="oauth-head">💻 这个渠道连的是你机器上另一个程序</div>
      <div class="help">本程序只向下面那个回环地址发请求，流量不出网卡${
        d.helpUrl?`。那个程序要你自己先装好并保持运行：<a href="${esc(d.helpUrl)}" target="_blank" rel="noreferrer">说明</a>`:"，要你自己先装好并保持运行"}。</div>
      <div class="help" style="color:var(--warn)">两件事要先知道：回环上走的是明文，同机的其他程序可能看到这里的令牌，所以别拿别处在用的密码来填；
        而这类网关用的是非官方协议，账号风险落在你自己的号上。</div>
    </div>` : "";
  // NapCat 自动配置。只对这个渠道出现：它是唯一一个要在本机改**另一个程序**
  // 配置的渠道，而那件事手工做要先找 6099 端口、从 webui.json 翻登录密钥、
  // 进页面新建 HTTP 服务器、自己想一个 token —— 全是实现细节。
  const setupHTML = (d.type==='napcat') ? `
    <div class="oauth-box">
      <div class="oauth-head">⚡ 自动配置</div>
      <div class="help">下面三个字段我来填。前提是你已经装好 NapCat、启动过一次并用手机扫码登录过。</div>
      <div class="help">还没装？Windows 上最省事的是
        <a href="https://github.com/NapNeko/NapCatQQ-Desktop/releases/latest" target="_blank" rel="noreferrer">NapCatQQ-Desktop</a>
        （一个安装包，带界面，能引导你装 QQ 并一键启停）·
        自己解压的话下
        <a href="https://github.com/NapNeko/NapCatQQ/releases/latest" target="_blank" rel="noreferrer">NapCat.Shell.Windows.Node.zip</a>
        · 各平台装法见
        <a href="https://napneko.github.io/guide/boot/Shell" target="_blank" rel="noreferrer">官方文档</a>
      </div>
      <div class="field" style="margin:8px 0 0">
        <label>NapCat 的文件夹（留空就让我自己找）</label>
        <input type="text" id="ncdir" placeholder="留空直接点检测；找不到再把文件夹地址粘进来">
        <div class="help">macOS 和 Linux 上这个位置是固定的，不用填。Windows 上你解压到哪都行，
          所以要粘一下 —— 在资源管理器里 Shift + 右键 → 复制文件地址。</div>
      </div>
      <button id="ncbtn" style="margin-top:8px">检测</button>
      <div id="ncpanel"></div>
    </div>` : "";
  $("#modal").innerHTML = `
    <h3>${d.icon} ${esc(d.name)}</h3>
    ${oauthFirst?"":`<div class="hint">密码类字段只存进系统密码管理器，不写配置文件、不进日志</div>`}
    ${riskHTML}
    ${localHTML}
    ${setupHTML}
    ${oauthFirst?oauthHTML:""}
    ${formFields.map(fieldHTML).join("")}
    ${adv.length?`<div class="adv-toggle" id="advtoggle">▸ 高级设置（主机 / 端口）</div>
      <div class="adv" id="adv">${adv.map(fieldHTML).join("")}</div>`:""}
    ${oauthFirst?manualHTML:oauthHTML}
    <div class="foot">
      <button class="primary" id="savebtn">测试并保存</button>
      <button id="cancelbtn">取消</button>
      <span class="status" id="st"></span>
    </div>`;
  // 挂闭包而不是拼内联 onclick：account 里出现引号会把 HTML 属性截断，
  // 按钮就变成点了没反应 —— 这个 bug 曾让「编辑」整个静默失效。
  $("#savebtn").onclick = () => {
    // 凭据字段被折起来的时候，直接把「姓名不能为空」抛出来等于指向一个
    // 看不见的输入框。先把折叠打开，并把两条路都说出来。
    const missing = credFields.filter(f=>f.required && !(($("#f_"+f.name)||{}).value||"").trim());
    if(missing.length){
      const m=$("#manual"); if(m) m.classList.add("show");
      $("#st").textContent = `先点上面的「连接${d.name}」，或在这里填${missing.map(f=>f.label).join("和")}`;
      return;
    }
    doSave(type, account);
  };
  $("#cancelbtn").onclick = close;
  const ob = $("#oauthbtn");
  if(ob) ob.onclick = () => startOAuth(type);
  const ncb = $("#ncbtn");
  if(ncb) ncb.onclick = () => ncDetect();
  const manualToggle = $("#manualtoggle");
  if(manualToggle) manualToggle.onclick = () => $("#manual").classList.toggle("show");
  const advToggle = $("#advtoggle");
  if(advToggle) advToggle.onclick = () => $("#adv").classList.toggle("show");
  if(account){const af=$("#f_"+d.accountField); if(af){af.readOnly=true; af.style.opacity=.6}}
  $("#mask").classList.add("show");
}

function collect(type){
  const d = DESCRIPTORS.find(x=>x.type===type);
  const values={};
  d.fields.forEach(f=>{
    const el=document.getElementById("f_"+f.name); if(!el)return;
    values[f.name] = f.kind==="bool" ? (el.checked?"true":"false") : el.value;
  });
  return {d,values};
}

// ── NapCat 自动配置 ───────────────────────────────────────────
// 用户只给一个文件夹地址，剩下的服务端做：读出 QQ 号、打开 HTTP 接口、
// 把 host 收到回环、生成令牌、启动 NapCat，然后把三个字段填好。
//
// 每一步都把服务端做了什么说出来（改了哪个文件、备份在哪、跑了什么命令）：
// 这是在动用户机器上**另一个程序**的配置，不该是个黑盒。
let NC = null;

const ncPost = (path, body) => api(path, {method:"POST",
  headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});

async function ncDetect(){
  const dir = $("#ncdir").value.trim();
  const panel = $("#ncpanel");
  // 留空是正当用法：服务端会去这个系统的常见位置找（mac 上那个路径被 QQ 的
  // 沙箱容器固定在七十来字符，让用户手打它是荒谬的）。
  panel.innerHTML = `<div class="help">${dir?"正在看这个文件夹…":"正在常见位置里找 NapCat…"}</div>`;
  const r = await ncPost("/api/napcat/detect", {dir});
  // 报错里有换行（「试过哪些位置」那几行），不保留换行会挤成一团
  if(!r.ok){ panel.innerHTML = `<div class="status bad" style="white-space:pre-wrap">${esc(r.error)}</div>`; return; }
  // 用服务端认定的那个目录，而不是输入框里的 —— 自动找到时输入框是空的
  NC = {dir:r.install.root, install:r.install, cmd:r.command, qq:(r.install.accounts[0]||{}).qq};
  ncRender();
}

function ncAccount(){ return (NC.install.accounts||[]).find(a=>a.qq===NC.qq) || {}; }

function ncRender(extra){
  const panel = $("#ncpanel"), accs = NC.install.accounts||[], a = ncAccount();
  const state = a.answering && a.hasToken ? "已就绪"
    : a.httpEnabled ? (a.hasToken ? "接口已开，但没在运行" : "接口已开，但没设令牌")
    : "接口没开";
  // host 是 0.0.0.0 的话同局域网的人也连得上，而那个口子能用这个 QQ 发消息。
  const hostWarn = a.host === "0.0.0.0"
    ? `<div class="help" style="color:var(--warn)">它现在监听 0.0.0.0，同一局域网的人也连得上 —— 会帮你收到 127.0.0.1</div>` : "";
  const pick = accs.length > 1
    ? `<div class="field" style="margin:8px 0 0"><label>用哪个 QQ</label>
         <select id="ncqq">${accs.map(x=>`<option value="${esc(x.qq)}" ${x.qq===NC.qq?"selected":""}>${esc(x.qq)}</option>`).join("")}</select></div>` : "";
  const noLauncher = NC.install.launcher ? ""
    : `<div class="help" style="color:var(--warn)">这个文件夹里没有认识的启动器，所以配置完要你自己启动 NapCat。
         macOS 上本来就没有：用 NapCat-Mac-Installer 那个安装器里的「启动 NapCat」。</div>`;

  panel.innerHTML = `
    <div class="ncl" style="margin-top:8px">✅ 找到 NapCat · 配置目录 <code>${esc(NC.install.configDir)}</code></div>
    <div class="ncl">QQ <b>${esc(a.qq||"?")}</b> · HTTP 接口${esc(state)} · 端口 ${a.port||3000}</div>
    ${hostWarn}${pick}${noLauncher}
    <button id="ncgo" class="primary" style="margin-top:8px">开启接口并填好表单</button>
    <div id="ncout">${extra||""}</div>`;
  const sel = $("#ncqq");
  if(sel) sel.onchange = () => { NC.qq = sel.value; ncRender(); };
  $("#ncgo").onclick = ncConfigure;
}

async function ncConfigure(){
  const out = $("#ncout"), btn = $("#ncgo");
  btn.disabled = true;
  out.innerHTML = `<div class="help">正在写 NapCat 的配置…</div>`;
  const r = await ncPost("/api/napcat/configure", {dir:NC.dir, qq:NC.qq});
  btn.disabled = false;
  if(!r.ok){ out.innerHTML = `<div class="status bad">${esc(r.error)}</div>`; return; }
  const res = r.result;
  ncFill(NC.qq, res.token, res.endpoint);
  const did = res.backupPath
    ? `已开启 HTTP 接口、host 收到 127.0.0.1${res.tokenKept?"、沿用原有令牌":"、生成了新令牌"}。
       原配置备份在 <code>${esc(res.backupPath)}</code>`
    : `它本来就是这么配的，一个字节都没改${res.tokenKept?"，令牌沿用现成的":""}`;
  if(!res.needsRestart){
    out.innerHTML = `<div class="status ok">✅ ${did}</div>
      <div class="ncl">三个字段已填好，点下面「测试并保存」即可</div>`;
    return;
  }
  // 配置文件是 NapCat 启动时读的，所以改完必须重启才生效。
  // 它还在跑的话我们不去杀它 —— 那是用户的 QQ，关不关由他决定。
  const live = ncAccount().answering;
  out.innerHTML = `<div class="status ok">✅ ${did}</div>
    ${live ? `<div class="ncl" style="color:var(--warn)">NapCat 正在用<b>旧配置</b>运行。请先关掉它的窗口，再点下面这个按钮</div>`
           : `<div class="ncl">配置文件是 NapCat 启动时读的，所以还要重启一次</div>`}
    ${NC.install.launcher
      ? `<button id="ncstart" style="margin-top:8px">启动 NapCat（不用再扫码）</button>
         <div class="help">会跑：<code>${esc(NC.cmd||"")}</code></div>`
      : `<div class="help">自己双击 NapCat 的启动器，起来之后点下面「测试并保存」</div>`}
    <div id="ncstartout"></div>`;
  const sb = $("#ncstart");
  if(sb) sb.onclick = ncStart;
}

async function ncStart(){
  const out = $("#ncstartout"), btn = $("#ncstart");
  btn.disabled = true;
  out.innerHTML = `<div class="help">正在启动，等它登录完成（要十几秒）…</div>`;
  const r = await ncPost("/api/napcat/start", {dir:NC.dir, qq:NC.qq});
  btn.disabled = false;
  if(!r.ok){
    out.innerHTML = `<div class="status bad">${esc(r.error)}</div>
      ${r.command?`<div class="help">试过的命令：<code>${esc(r.command)}</code></div>`:""}`;
    return;
  }
  if(r.answering){
    out.innerHTML = `<div class="status ok">✅ NapCat 的 HTTP 接口已经在 ${esc(r.endpoint)} 上应答${
      r.started?"":"（它本来就在跑）"}</div>
      <div class="ncl">点下面「测试并保存」，会真打一次 get_login_info</div>`;
    return;
  }
  // 起了但端口没答：最常见的原因是快速登录没成功，NapCat 又在等扫码。
  out.innerHTML = `<div class="status bad">已经启动它了，但 ${esc(r.endpoint)} 还没有应答</div>
    <div class="help">去 NapCat 的窗口看一眼：如果它在等扫码，用手机扫一下；
      扫完回来点「测试并保存」。跑的命令是 <code>${esc(r.command)}</code></div>`;
}

function ncFill(qq, token, endpoint){
  const set = (id,v) => { const el = document.getElementById(id); if(el && v) el.value = v; };
  set("f_self_id", qq); set("f_token", token); set("f_endpoint", endpoint);
}

// ── OAuth 设备流 ──────────────────────────────────────────────
// 轮询在服务端做（授权服务规定了最小间隔，slow_down 还要加间隔），
// 这里只是每 2 秒问一次状态。
let OAUTH_SESSION = null;

async function startOAuth(type){
  const {values} = collect(type);
  const panel = $("#oauthpanel");
  panel.innerHTML = `<div class="help">正在向授权服务要验证码…</div>`;
  const r = await api("/api/oauth/start",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,values})});
  if(!r.ok){ panel.innerHTML = `<div class="status bad">${esc(r.error||"无法开始授权")}</div>`; return; }

  const s = r.session;
  OAUTH_SESSION = s.id;
  const openURL = s.verificationUriComplete || s.verificationUri;
  panel.innerHTML = `
    <div class="oauth-code">
      <div class="help">① 复制这个验证码</div>
      <div class="code-row"><code id="ucode">${esc(s.userCode)}</code>
        <button id="copycode">复制</button></div>
      <div class="help" style="margin-top:8px">② 打开 <a href="${esc(openURL)}" target="_blank" rel="noreferrer">${esc(s.verificationUri)}</a> 粘贴进去并确认</div>
      <div class="status" id="ost">③ 等待授权…</div>
    </div>`;
  $("#copycode").onclick = async () => {
    try{ await navigator.clipboard.writeText(s.userCode); $("#copycode").textContent="已复制"; }
    catch(e){ $("#copycode").textContent="请手动复制"; }
  };
  pollOAuth(type, s.id);
}

async function pollOAuth(type, id){
  const ost = () => $("#ost");
  while(OAUTH_SESSION === id){
    await new Promise(r=>setTimeout(r,2000));
    if(OAUTH_SESSION !== id) return;            // 弹窗已关
    const st = await api("/api/oauth/status?session="+encodeURIComponent(id));
    const el = ost();
    if(!el) return;                              // DOM 没了，停
    if(st.state === "pending"){ el.className="status"; el.textContent="③ 等待授权…"; continue; }
    if(st.state === "ok"){
      el.className="status ok";
      el.textContent = "✅ 已连接为 " + st.account + "，渠道已保存";
      OAUTH_SESSION = null;
      setTimeout(()=>{close();refresh();},1200);
      return;
    }
    el.className="status bad"; el.textContent = "授权失败：" + (st.error||"未知原因");
    OAUTH_SESSION = null;
    return;
  }
}

async function doSave(type, account){
  const {d,values} = collect(type);
  const st=$("#st"); st.className="status"; st.textContent="测试连通中…";
  const acc = account || values[d.accountField];
  const t = await api("/api/channels/test",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,account:acc,values})});
  if(!t.ok){ st.className="status bad"; st.textContent="连通失败：" + t.error; return; }
  const r = await api("/api/channels",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,values})});
  if(r.error){ st.className="status bad"; st.textContent="保存失败：" + r.error; return; }
  st.className="status ok"; st.textContent="✅ 已连通并保存";
  setTimeout(()=>{close();refresh();},600);
}

async function testSaved(type,account){
  const r = await api("/api/channels/test",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,account,values:{}})});
  alert(r.ok ? "✅ 连通正常" : "连通失败：\n"+r.error);
}

async function del(type,account){
  if(!confirm(`删除渠道 ${type} / ${account}？\n会同时删除它在系统密码管理器里的凭据。`))return;
  await api("/api/channels/delete",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,account})});
  refresh();
}

$("#mask").onclick=(e)=>{if(e.target.id==="mask")close()};
boot();
</script>
