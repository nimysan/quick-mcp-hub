<script>
/* 页面完全照 Figma 稿实现：
     列表页 2:1396（浅）/ 14:2（深），详情页 2:1694 / 14:333
   颜色和图标来自 internal/webui/design/tokens.json，由 Figma Dev Mode MCP 取出。
   文案逐条取自稿子，不是我自己编的。 */

const $ = (s,el=document)=>el.querySelector(s);
const api = async (url,opt)=>{const r=await fetch(url,opt);return r.json()};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic = (n,cls='ic') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;

let DESCRIPTORS=[], CHANNELS=[], TAG="", EXEPATH="", LASTCLIENT=null, CFGPATH="", LOGPATH="", SECRET_BACKEND="";

// 每个渠道用哪个图标：稿子里邮箱是 Mail、云之家是云、NapCat 是本机程序。
// 没有对应的用 Plug 兜底 —— 新渠道加进来不会缺图标。
const ICONS = {qqmail:"Mail", custommail:"Mail", github:"Blocks", jira:"ScrollText",
  napcat:"Monitor", yunzhijia:"Laptop", ghwasm:"Blocks"};
const iconOf = t => ICONS[t] || "Plug";

const TAG_LABELS = {email:"邮件", devtools:"开发", project:"项目", erp:"ERP",
  finance:"财务", im:"协作", office:"office"};

async function boot(){
  initTheme();
  const d = await api("/api/descriptors");
  DESCRIPTORS = d.descriptors; CFGPATH = d.configPath; LOGPATH = d.logPath || "";
  EXEPATH = d.exePath || ""; LASTCLIENT = d.lastClient || null;
  SECRET_BACKEND = d.secretBackend || "";
  $("#ver").textContent = d.version;
  $("#cfgpath").textContent = "本地配置 · " + CFGPATH.split(/[\\/]/).pop();
  $("#cfgpath").title = CFGPATH;
  if(LOGPATH){ const l=$("#loglink"); l.hidden=false; l.onclick=()=>window.open("/api/log","_blank"); }
  // 侧栏的「连接与配置」是首页链接 —— 在详情页上点它要回列表。
  $("#navhome").onclick = e => { e.preventDefault(); goList(); };
  $("#navlog").onclick = e => { e.preventDefault(); window.open("/api/log","_blank"); };
  $("#refresh").onclick = refresh;
  await refresh();
  route();   // 直接用带 hash 的地址打开时，要落到详情页
}

async function refresh(){
  const {channels=[]} = await api("/api/channels");
  CHANNELS = channels;
  renderSteps(); renderClient(); renderMine(); renderMarket(); renderOnboard();
}

// 稿子上那条三步流程。它回答的是「整件事分几步、我现在在哪一步」——
// 对业务人员这条比任何说明都有用。
function renderSteps(){
  const done1 = CHANNELS.length > 0;
  const done3 = !!LASTCLIENT;
  const steps = [
    ["配置渠道", done1],
    ["生成 MCP 配置", done1],
    ["接入 Amazon Quick", done3],
  ];
  // 当前步 = 第一个没完成的
  let cur = steps.findIndex(s=>!s[1]);
  if(cur < 0) cur = steps.length - 1;
  $("#steps").innerHTML = steps.map(([t,ok],i)=>{
    const cls = ok ? "st done" : (i===cur ? "st on" : "st");
    const mark = ok ? ic("Check") : `<span class="n">${i+1}</span>`;
    return `<span class="${cls}">${ok?`<span class="n">${ic("Check")}</span>`:`<span class="n">${i+1}</span>`}${esc(t)}</span>`
      + (i<steps.length-1 ? ic("ChevronRight") : "");
  }).join("");
}

// 客户端状态卡。稿子把「历史注册」和「当前状态」分成两栏，还加了一句
// 「历史注册不代表当前可用」—— 这正是这个信号的真实局限：我们记的是最近一次
// 握手，那是历史。不说清的话用户会以为那个工具数是当前值。
function renderClient(){
  const tools = CHANNELS.reduce((n,v)=>n+activeTools(v).length,0);
  const lc = LASTCLIENT;
  const clientName = lc ? (lc.client || "某个客户端") : "Amazon Quick";
  const head = lc
    ? `<span class="name">${esc(clientName)}</span>
       ${lc.version?`<span class="tag">${esc(lc.version)}</span>`:""}
       <span class="pill ok">已连接</span>
       <span class="right">最近一次连接 · ${ago(lc.at)}
         <a href="#" id="obhelp">接入说明 ↗</a></span>`
    : `<span class="name">${esc(name)}</span>
       <span class="pill warn">未连接</span>
       <span class="right">还没有任何客户端连接过
         <a href="#" id="obhelp">接入说明 ↗</a></span>`;
  $("#clientcard").innerHTML = `
    <div class="cl-head">${ic("Monitor","ic-16 ic")}${head}</div>
    <div class="hsep"></div>
    <div class="cl-stats">
      <div class="cl-stat">
        <div class="k">最近一次注册记录</div>
        <div class="v">${lc?(lc.tools||0):0} <small>个工具${lc?` · ${ago(lc.at)}`:""}</small></div>
      </div>
      <div class="cl-stat">
        <div class="k">当前状态</div>
        <div class="v">${CHANNELS.length} <small>个账号</small> ${tools} <small>个工具</small></div>
      </div>
      <div class="cl-hint">${ic("CircleHelp")}
        <span>历史注册不代表当前可用；修改渠道后，请重新生成配置并在客户端刷新。</span></div>
    </div>`;
  const h = $("#obhelp");
  if(h) h.onclick = e => { e.preventDefault(); $("#onboard").scrollIntoView({behavior:"smooth",block:"center"}); };
}

// writeOn 判断这个渠道实例的写开关是否打开。
//
// 单独抽出来是因为字段名错过一次：这里写的是 d.writeSwitches（复数），而服务端
// 端出的是 writeSwitch（单数）。读一个不存在的字段不会报错，`undefined || []`
// 正好得到空数组，于是「当前权限」在所有渠道上永远显示「只读」—— 哪怕写开关
// 其实是开着的。这种错误静默且会被复制到每个用它的地方，所以字段名只准出现一次。
function writeOn(d, inst){
  const sw = d.writeSwitch;
  if(!sw) return false;             // 这个渠道没有写工具
  return inst.settings?.[sw] === "true";
}

function activeTools(v){
  const d=v.descriptor, inst=v.instance;
  const write = new Set(d.writeTools||[]);
  const on = writeOn(d, inst);
  return (d.tools||[]).filter(t=>!write.has(t) || on);
}

function renderMine(){
  $("#minemeta").textContent = `${CHANNELS.length} 个账号 · 可为同一渠道添加多个账号`;
  if(!CHANNELS.length){
    $("#list").innerHTML = `<div class="foot-note" style="margin:0">${ic("CircleDashed")}
      <span>还没有配置任何渠道。从下面的「内置渠道」里选一个开始。</span></div>`;
    return;
  }
  const rows = CHANNELS.map(v=>{
    const d=v.descriptor, i=v.instance;
    const write = writeOn(d, i);
    return `<tr>
      <td><div class="ch"><span class="ico">${ic(iconOf(d.type),"ic-16 ic")}</span>
        <div><div class="nm">${esc(d.name)}</div><div class="ac">${esc(i.account)}</div></div></div></td>
      <td>${(()=>{
        // 授权已经死了就在列表上说出来。不然用户要点进详情页、再点一次
        // 测试连接才知道，而在那之前它表现为模型那边「工具调用失败」。
        const a = v.auth;
        if(a && !a.canRefresh && (a.stale || !a.expiresAt))
          return `<span class="pill warn" title="访问令牌已过期且无法自动续期">授权已失效</span>`;
        return `<span class="pill ok">已配置</span>`;
      })()}</td>
      <td style="color:var(--text-secondary)">${write?"可写":"只读"}</td>
      <td>
        <button class="ghost" data-test="${esc(d.type)}|${esc(i.account)}">测试</button>
        <button class="ghost" data-edit="${esc(d.type)}|${esc(i.account)}">配置</button>
        <button class="ghost" data-del="${esc(d.type)}|${esc(i.account)}" title="删除">${ic("Trash")}</button>
      </td></tr>`;
  }).join("");
  const tools = CHANNELS.reduce((n,v)=>n+activeTools(v).length,0);
  const all = CHANNELS.reduce((n,v)=>n+(v.descriptor.tools||[]).length,0);
  $("#list").innerHTML = `
    <table class="tbl"><thead><tr>
      <th>渠道 / 账号</th><th>配置状态</th><th>权限</th><th>操作</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <div class="foot-note">${ic("CircleHelp")}
      <span>最近注册：${tools} 个工具${all>tools?`；另有 ${all-tools} 个工具因开关关闭未注册。`:"。"}</span></div>`;
  bindRowActions();
}

function bindRowActions(){
  $("#list").querySelectorAll("[data-test]").forEach(b=>{
    const [t,a]=b.dataset.test.split("|"); b.onclick=()=>testSaved(t,a);
  });
  $("#list").querySelectorAll("[data-edit]").forEach(b=>{
    // 进详情页，不再开弹窗 —— 稿子把单个渠道的配置画成了独立页面。
    const [t,a]=b.dataset.edit.split("|"); b.onclick=()=>go(t,a,"account");
  });
  $("#list").querySelectorAll("[data-del]").forEach(b=>{
    const [t,a]=b.dataset.del.split("|"); b.onclick=()=>del(t,a);
  });
}

function renderMarket(){
  const allTags=[...new Set(DESCRIPTORS.flatMap(d=>d.tags||[]))].sort();
  $("#srcinfo").textContent = `${DESCRIPTORS.filter(d=>d.available).length} 个可用渠道 · 内置目录`;
  $("#tagbar").innerHTML =
    `<span class="tg ${TAG?'':'on'}" data-tag="">全部 ${DESCRIPTORS.length}</span>` +
    allTags.map(t=>{
      const n=DESCRIPTORS.filter(d=>(d.tags||[]).includes(t)).length;
      return `<span class="tg ${TAG===t?'on':''}" data-tag="${esc(t)}">${esc(TAG_LABELS[t]||t)} ${n}</span>`;
    }).join("");
  $("#tagbar").querySelectorAll("[data-tag]").forEach(el=>{
    el.onclick = () => { TAG = el.dataset.tag; renderMarket(); };
  });

  const list = TAG ? DESCRIPTORS.filter(d=>(d.tags||[]).includes(TAG)) : DESCRIPTORS;
  const mine = t => CHANNELS.filter(v=>v.descriptor.type===t).length;
  $("#grid").innerHTML = list.map((d,idx)=>{
    const n = mine(d.type);
    return `<div class="mk ${n?'has':''}">
      <div class="mk-top">
        <span class="ico">${ic(iconOf(d.type),"ic-16 ic")}</span>
        <div><div class="nm">${esc(d.name)}</div>
          <div class="id">${esc(d.type)}${d.version?` · v${d.version}`:""}</div></div>
        ${d.available
          ? `<button data-add="${idx}" class="${n?'':'primary'}">${ic(n?"Plug":"Mail")}${n?'添加账号':'连接账号'}</button>`
          : `<button disabled>暂未支持</button>`}
      </div>
      <div class="desc">${esc(d.summary)}</div>
      ${(d.writeTools||[]).length?`<div class="note">默认只读 · 写入需单独开启</div>`:""}
      ${n?`<div class="note mine">已配置 ${n} 个</div>`:""}
    </div>`;
  }).join("");
  $("#grid").querySelectorAll("[data-add]").forEach(b=>{
    b.onclick = () => openForm(list[+b.dataset.add].type, null);
  });
}

// 右栏：接入 Amazon Quick。
//
// 稿子里这块是「生成 MCP 配置」按钮 + 配置预览。稿子的预览写的是
// "url": "<本机 MCP 地址>"（HTTP 传输），而程序现在只做 stdio，所以这里给的是
// command + args —— 那是**真能用**的配置。HTTP 传输是另一件事，做完再换。
function renderOnboard(){
  const cfg = JSON.stringify({mcpServers:{"mcp-hub":{command:EXEPATH,args:["-serve"]}}},null,2);
  const tools = CHANNELS.reduce((n,v)=>n+activeTools(v).length,0);
  $("#onboard").innerHTML = `
    <div class="sec-head" style="margin-bottom:7px">
      <h2>${ic("ScrollText")} 接入 Amazon Quick</h2>
    </div>
    <div class="desc" style="font-size:11px;color:var(--text-secondary)">
      把已配置渠道汇总为 MCP 配置，再添加到你的客户端。</div>
    <div class="hsep"></div>
    <div class="kv"><span class="k">包含连接</span><span class="v">${CHANNELS.length} 个账号</span></div>
    <div class="kv"><span class="k">当前可用工具</span><span class="v">${tools} 个</span></div>
    <div class="kv"><span class="k">访问策略</span><span class="v">按各渠道权限</span></div>
    <div class="tiny">实际可用工具以生成结果为准。</div>
    <button class="primary block" id="obcopy" style="margin:16px 0 12px">${ic("ScrollText")}复制 MCP 配置</button>
    <div class="sec-head" style="margin-bottom:5px">
      <span class="meta">配置预览</span>
      <button class="linkbtn" id="obcopypath">只复制路径</button>
    </div>
    <pre class="pre">${esc(cfg)}</pre>
    <div class="tiny" style="margin-top:7px">这段是真实可用的配置，含本机程序路径，不含任何凭据。</div>
    <div class="hsep"></div>
    <div style="font-size:11px;font-weight:700;margin-bottom:8px">在 Amazon Quick 中完成接入</div>
    <ul class="ol">
      <li>复制上方 MCP 配置</li>
      <li>Customize → Connectors → Add Local Connector → 选 Local</li>
      <li>粘贴配置，Test Connection 通过后 Add，最后点 Sync</li>
    </ul>
    <div class="hsep"></div>
    <div style="font-size:11px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:5px">
      ${ic("HardDrive")}配置保存在本机</div>
    <div class="path">${esc(CFGPATH)}</div>
    <div class="tiny" style="margin-top:7px">复制配置不会自动建立客户端连接。</div>
    <div class="st" id="obst" style="margin-top:8px"></div>`;
  $("#obcopy").onclick = () => copyText(cfg, "已复制，去 Quick 里粘贴");
  $("#obcopypath").onclick = () => copyText(EXEPATH, "路径已复制");
}

async function copyText(text, okMsg){
  const st = $("#obst");
  try{
    await navigator.clipboard.writeText(text);
    st.className = "st ok"; st.textContent = okMsg;
  }catch(e){
    st.className = "st bad"; st.textContent = "复制不了，请手工选中上面那段";
  }
  setTimeout(()=>{ st.textContent=""; }, 3000);
}

// 主题：稿子上那两个胶囊。用户的显式选择要压过系统设置，所以存 localStorage
// 并写 html[data-theme]；没选过时跟随系统（CSS 的 prefers-color-scheme）。
function initTheme(){
  const saved = localStorage.getItem("theme");
  if(saved) document.documentElement.dataset.theme = saved;
  const marks = () => $("#themeopts").querySelectorAll("button").forEach(b=>{
    b.classList.toggle("on", b.dataset.theme === (document.documentElement.dataset.theme||""));
  });
  $("#themeopts").querySelectorAll("button").forEach(b=>{
    b.onclick = () => {
      document.documentElement.dataset.theme = b.dataset.theme;
      localStorage.setItem("theme", b.dataset.theme);
      marks();
    };
  });
  marks();
}

// left 把一个未来时刻说成「还有多久」。已经过去的返回空串 —— 调用方据此
// 走「已过期」那一支，而不是显示一个负数。
function left(iso){
  const t = Date.parse(iso);
  if(isNaN(t)) return "";
  const s = (t - Date.now())/1000;
  if(s <= 0) return "";
  if(s < 90) return "不到 2 分钟";
  if(s < 3600) return Math.round(s/60)+" 分钟";
  const h = Math.floor(s/3600), m = Math.round((s%3600)/60);
  if(h < 24) return m ? `${h} 小时 ${m} 分钟` : `${h} 小时`;
  return Math.round(s/86400)+" 天";
}

// authPill / authDetail 把令牌状态说成人话。
//
// 这里刻意不单独摆「剩余 1 小时 52 分钟」这个数字：访问令牌本来就只有两小时，
// 而它到期时程序自己会换一张。只给数字的后果是用户以为每两小时要重新授权
// 一次 —— 一个会让人得出错误结论的真数字，比不显示更糟。所以凡是出现这个
// 数字的地方，都连着「会不会自动续期」一起说。
// 这里刻意不说「有效」：本机只知道「有一个刷新令牌」，不知道它还被对方认不认
// （被吊销、在对方系统里解除授权，本机都看不出来）。说「可自动续期」是我们
// 真的知道的那件事；要知道现在是否真能用，只有点「测试连接」。
function authPill(a){
  if(!a) return `<span class="pill">长期令牌</span>`;
  if(a.canRefresh) return `<span class="pill ok">可自动续期</span>`;
  if(a.stale || !a.expiresAt) return `<span class="pill warn">需重新授权</span>`;
  return `<span class="pill ok">有效</span>`;
}

function authDetail(a, d){
  // 没有令牌组＝凭据是手工填进来的长期令牌，它本身不带到期信息。
  if(!a) return `<div class="tiny">这条连接用的是手工填写的令牌，没有到期信息。
    它失效时只会表现为调用失败。</div>`;

  // 刷新时 obtainedAt 会重置，所以它既可能是首次授权、也可能是上次续期的
  // 时刻。写「最后一次续期」对一张从没刷新过的令牌是错的，所以两种都说。
  const renewed = a.obtainedAt ? `<div class="kv"><span class="k">上次授权或续期</span>
    <span class="v">${ago(a.obtainedAt)}</span></div>` : "";
  const host = d && d.oauth ? esc(d.oauth.authHost) : "授权服务";

  // 旧版本存下的令牌可能没有记到期时间。那种令牌不会被判为该刷新，所以它
  // 一过期就死在原地 —— 这件事必须说出来，否则页面显示「有效」而它随时会坏。
  if(!a.expiresAt){
    return `<div class="tiny">这份令牌没有记到期时间（旧版本存下的），
      所以到期时不会自动续期，而是直接调用失败。建议现在重新授权一次。</div>${renewed}`;
  }

  const rest = left(a.expiresAt);
  if(a.canRefresh){
    const now = rest
      ? `访问令牌还有 <b>${rest}</b>，到期前程序会自动续期，不用你管。`
      : `访问令牌已过期，下次调用时程序会自动续期。`;
    return `<div class="tiny">${now}
      换不成（刷新令牌被吊销、在${host}那边解除了授权）才需要你重新授权，
      而这件事本机看不出来 —— 要确认现在真的可用，点上面的「测试连接」。</div>
      <div class="kv"><span class="k">当前令牌到期</span>
        <span class="v">${rest?esc(rest)+"后":"已到期"}</span></div>${renewed}`;
  }
  if(!rest){
    return `<div class="tiny">访问令牌已过期，而且没有可用的刷新令牌 ——
      这条连接现在不可用，必须重新授权。</div>${renewed}`;
  }
  return `<div class="tiny">访问令牌还有 <b>${esc(rest)}</b>。
    这份凭据没有刷新令牌，所以到期后不会自动续期，需要你重新授权一次。</div>${renewed}`;
}

function ago(iso){
  const t = Date.parse(iso);
  if(isNaN(t)) return "未知";
  const s = Math.max(0,(Date.now()-t)/1000);
  if(s<90) return "刚刚";
  if(s<3600) return Math.round(s/60)+" 分钟前";
  if(s<86400) return Math.round(s/3600)+" 小时前";
  return Math.round(s/86400)+" 天前";
}

// closeModal 关掉弹窗。
//
// 刻意不叫 close：那个名字在浏览器里是 window.close 的别名，所以一旦本地定义
// 丢了，onclick = close 会静默变成「调用 window.close()」—— 浏览器对非脚本
// 打开的页面直接忽略它，于是按钮毫无反应，而语法检查完全查不出来。
// 这正是上一版的真实故障：取消关不掉，保存成功后弹窗也不自动关。
function closeModal(){
  $("#mask").classList.remove("show");
  // 关弹窗就放弃正在进行的授权：服务端那个轮询协程不该在没人看的时候
  // 继续打授权服务。
  if(OAUTH_SESSION){
    const id = OAUTH_SESSION; OAUTH_SESSION = null;
    api("/api/oauth/cancel",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session:id})}).catch(()=>{});
  }
}

// Esc 也要能关 —— 弹窗没有 Esc 等于把人关在里面。
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && $("#mask").classList.contains("show")) closeModal();
});

async function openForm(type, account){
  const d = DESCRIPTORS.find(x=>x.type===type);
  let inst=null;
  if(account){
    const {channels=[]} = await api("/api/channels");
    inst = channels.find(v=>v.descriptor.type===type && v.instance.account===account)?.instance;
  }
  const val=(f)=> inst ? (f.name===d.accountField?inst.account:(inst.settings?.[f.name]??f.default)) : f.default;
  // 一键建应用的渠道（飞书）：App ID 不放在高级设置里，而是和 App Secret
  // 一起收进连接区的「已有应用」折叠 —— 那两项是一条后路，正路是扫码。
  // 编辑已保存的连接时不收：App ID 要照常出现在高级设置里，否则保存时
  // 它会从设置里丢掉，之后刷新令牌就找不到应用了。
  const appField = (d.oauth && d.oauth.register && !account) ? d.oauth.clientIdField : "";
  const basic = d.fields.filter(f=>!f.advanced && f.name!==appField);
  const adv   = d.fields.filter(f=>f.advanced && f.name!==appField);
  const fieldHTML=(f)=>{
    const v = val(f)||"";
    if(f.kind==="bool"){
      const on=(v==="true"||v===true);
      return `<div class="field check"><input type="checkbox" id="f_${f.name}" ${on?"checked":""}>
        <label for="f_${f.name}">${f.label}</label></div>
        ${f.help?`<div class="help" style="margin:-8px 0 12px 26px">${esc(f.help)}</div>`:""}`;
    }
    const tag = f.kind==="password"?`<span class="secret-tag">🔑 密码类</span>`:"";
    const ph = f.kind==="password"&&account?"（留空表示不修改）":(f.placeholder||"");
    const type = f.kind==="password"?"password":(f.kind==="number"?"number":"text");
    return `<div class="field"><label>${f.label}${f.required?' <span style="color:var(--danger)">*</span>':""}${tag}</label>
      <input type="${type}" id="f_${f.name}" value="${f.kind==="password"?"":esc(v)}" placeholder="${esc(ph)}">
      ${f.help?`<div class="help">${esc(f.help)}</div>`:""}</div>`;
  };
  // 账号字段编辑时锁定（它是凭据键的一部分）
  //
  // oauthFirst：这个渠道不需要用户先填任何东西就能授权（没有 clientIdField），
  // 那么正路就是点按钮，输入框是给「扫不了码」的少数人留的后路。所以把按钮
  // 排在最前、做成主按钮，把姓名和令牌收到折叠里 —— 先摆两个输入框，所有人
  // 都会以为需要手动填。
  //
  // GitHub 那种有 clientIdField 的不走这条：它必须先填 Client ID 才能连，
  // 把那个框折起来等于让按钮点了就报错。
  //
  // 能一键建应用的渠道（d.oauth.register）同样算：没填 App ID 时点按钮
  // 会先建应用，所以不需要先填任何东西。
  const oauthFirst = !!(d.oauth && !account && (!d.oauth.clientIdField || d.oauth.register));
  const credNames = [d.accountField, d.secretField].filter(Boolean);
  const credFields = oauthFirst ? basic.filter(f=>credNames.includes(f.name)) : [];
  const formFields = oauthFirst ? basic.filter(f=>!credNames.includes(f.name)) : basic;
  // 编辑已保存的渠道时这一块原来是不渲染的（条件写的是 !account），于是
  // 一条 OAuth 连接的授权失效之后，页面上没有任何地方能重新授权 —— 留在
  // 那里的只有一个令牌输入框，而设备流的令牌是一整段 JSON，用户填不出来。
  // 唯一的出路是删掉重建，那会连带删掉密码管理器里的凭据和写开关设置。
  // 「已有应用」后路：IT 建好了应用、或企业不允许员工自建应用时，填 App ID
  // 和 App Secret 再点连接。App Secret 不是表单字段 —— 它只随连接请求走，
  // 最后进密码管理器，不进配置文件。
  const cs = d.oauth && d.oauth.clientSecret;
  const appFieldDef = appField ? d.fields.find(f=>f.name===appField) : null;
  const appHTML = (appFieldDef && cs && !account) ? `
    <div class="adv-toggle" id="apptoggle">▸ 已经有应用了？填 ${esc(appFieldDef.label)} 和 ${esc(cs.label)}</div>
    <div class="adv" id="appbox">
      <div class="tiny">两项都填了，点连接就跳过建应用，直接授权</div>
      ${fieldHTML(appFieldDef)}
      <div class="field"><label>${esc(cs.label)} <span class="secret-tag">🔑 密码类</span></label>
        <input type="password" id="oc_${cs.name}" placeholder="${esc(cs.placeholder||"")}">
        ${cs.help?`<div class="help">${esc(cs.help)}</div>`:""}</div>
    </div>` : "";
  const oauthHTML = d.oauth ? `
    <div class="oauth-box${oauthFirst?" lead":""}">
      <div class="risk-head">🔗 ${account?`授权失效了？重新确认一次`
        :(oauthFirst?`扫码连接，不用手工生成令牌`:`用 OAuth 连接（不用手工生成令牌）`)}</div>
      ${d.oauth.register ? `
      <div class="help">用飞书扫码确认就行，不用填任何东西。</div>
      <div class="adv-toggle" id="scopetoggle">▸ 查看申请的权限</div>
      <div class="adv" id="scopebox"><div class="tiny">授权在 <b>${esc(d.oauth.authHost)}</b> 完成，申请：<code>${esc((d.oauth.scopes||[]).join(" "))}</code></div></div>`
      : `<div class="help">点下面的按钮，会把你送到 <b>${esc(d.oauth.authHost)}</b> 授权${
        d.oauth.scopes?.length?`，申请的权限：<code>${esc(d.oauth.scopes.join(" "))}</code>`:""}</div>`}
      ${account?`<div class="help">完成后替换本机保存的令牌，账号和这里的其他设置不变。</div>`:""}
      ${d.oauth.help?`<div class="help">${esc(d.oauth.help)}${
        d.oauth.setupUrl?` · <a href="${esc(d.oauth.setupUrl)}" target="_blank" rel="noreferrer">去注册</a>`:""}</div>`:""}
      ${appHTML}
      <button class="${oauthFirst?"primary":""}" id="oauthbtn" style="margin-top:8px">${
        account?`重新授权`:`连接${esc(d.name)}`}</button>
      <div id="oauthpanel"></div>
    </div>` : "";
  // 手动填的后路：默认收起。里面放的是凭据字段，所以「只存进密码管理器」
  // 那句提示也跟着挪进来 —— 折起来的时候它在上面只是噪音。
  const manualHTML = (credFields.length && !(d.oauth && d.oauth.register)) ? `
    <div class="adv-toggle" id="manualtoggle">▸ 扫不了码？手动填${esc(credFields.map(f=>f.label).join("和"))}</div>
    <div class="adv" id="manual">
      <div class="tiny">密码类字段只存进系统密码管理器，不写配置文件、不进日志</div>
      ${credFields.map(fieldHTML).join("")}
    </div>` : "";
  const riskHTML = d.thirdPartyCode ? `
    <div class="risk">
      <div class="risk-head">🧩 这个渠道会在你的机器上执行第三方代码</div>
      <div class="help">代码跑在 wasm 沙箱里：没有文件、没有钥匙串、不能连任意地址。
        它只能访问 <b>${esc((d.allowedHosts||[]).join(" "))}</b>，
        凭据由本程序注入请求头，插件代码看不到你的令牌。</div>
      ${(d.writeTools||[]).length?`<div class="help" style="color:var(--warn)">其中 ${(d.writeTools||[]).length} 个写操作，写开关关着时不会注册给模型</div>`:''}
    </div>` : "";
  const localHTML = d.localProgram ? `
    <div class="risk">
      <div class="risk-head">💻 这个渠道连的是你机器上另一个程序</div>
      <div class="help">本程序只向下面那个回环地址发请求，流量不出网卡${
        d.helpUrl?`。那个程序要你自己先装好并保持运行：<a href="${esc(d.helpUrl)}" target="_blank" rel="noreferrer">说明</a>`:"，要你自己先装好并保持运行"}。</div>
      <div class="help" style="color:var(--warn)">两件事要先知道：回环上走的是明文，同机的其他程序可能看到这里的令牌，所以别拿别处在用的密码来填；
        而这类网关用的是非官方协议，账号风险落在你自己的号上。</div>
    </div>` : "";
  // NapCat 自动配置。只对这个渠道出现：它是唯一一个要在本机改**另一个程序**
  // 配置的渠道，而那件事手工做要先找 6099 端口、从 webui.json 翻登录密钥、
  // 进页面新建 HTTP 服务器、自己想一个 token —— 全是实现细节。
  const setupHTML = (d.type==='napcat') ? `
    <div class="risk">
      <div class="risk-head">⚡ 自动配置</div>
      <div class="help">下面三个字段我来填。前提是你已经装好 NapCat、启动过一次并用手机扫码登录过。</div>
      <div class="help">还没装？Windows 上最省事的是
        <a href="https://github.com/NapNeko/NapCatQQ-Desktop/releases/latest" target="_blank" rel="noreferrer">NapCatQQ-Desktop</a>
        （一个安装包，带界面，能引导你装 QQ 并一键启停）·
        自己解压的话下
        <a href="https://github.com/NapNeko/NapCatQQ/releases/latest" target="_blank" rel="noreferrer">NapCat.Shell.Windows.Node.zip</a>
        · 各平台装法见
        <a href="https://napneko.github.io/guide/boot/Shell" target="_blank" rel="noreferrer">官方文档</a>
      </div>
      <div class="field" style="margin:8px 0 0">
        <label>NapCat 的文件夹（留空就让我自己找）</label>
        <input type="text" id="ncdir" placeholder="留空直接点检测；找不到再把文件夹地址粘进来">
        <div class="help">macOS 和 Linux 上这个位置是固定的，不用填。Windows 上你解压到哪都行，
          所以要粘一下 —— 在资源管理器里 Shift + 右键 → 复制文件地址。</div>
      </div>
      <button id="ncbtn" style="margin-top:8px">检测</button>
      <div id="ncpanel"></div>
    </div>` : "";
  // 飞书网页文档：要先装浏览器扩展并配对。三步都在这里做完，用户不必去找目录。
  const fwHTML = (d.type==='feishu-web') ? `
    <div class="risk">
      <div class="risk-head">🧩 要先装一个浏览器扩展</div>
      <div class="help">登录态在你自己的 Chrome / Edge 里，本程序不碰密码和 cookie。扩展只能访问飞书 / Lark 的域名和本机 127.0.0.1，
        没有任何写操作；文档所有者禁止了复制或导出的，一律不读，也没有开关能强制读。</div>
      <div class="help">① <button id="fwextract">释放扩展到本机目录</button> <span id="fwdir"></span></div>
      <div class="help">② 在浏览器地址栏打开 <code>chrome://extensions</code>（Edge 是 <code>edge://extensions</code>），
        打开「开发者模式」，点「加载已解压的扩展程序」，选上面那个目录</div>
      <div class="help">③ <button id="fwpair">生成配对码</button> <code id="fwcode"></code>
        复制后点浏览器工具栏里的扩展图标，粘进去保存。重新生成会让旧的配对码失效</div>
      <div class="help" id="fwstatus"></div>
    </div>` : "";
  $("#modal").innerHTML = `
    <h3>${d.icon} ${esc(d.name)}</h3>
    ${oauthFirst?"":`<div class="tiny">密码类字段只存进系统密码管理器，不写配置文件、不进日志</div>`}
    ${riskHTML}
    ${localHTML}
    ${setupHTML}
    ${fwHTML}
    ${oauthFirst?oauthHTML:""}
    ${formFields.map(fieldHTML).join("")}
    ${adv.length?`<div class="adv-toggle" id="advtoggle">▸ 高级设置（主机 / 端口）</div>
      <div class="adv" id="adv">${adv.map(fieldHTML).join("")}</div>`:""}
    ${oauthFirst?manualHTML:oauthHTML}
    <div class="foot">
      <button class="primary" id="savebtn">测试并保存</button>
      <button id="cancelbtn">取消</button>
      <span class="st" id="st"></span>
    </div>`;
  // 挂闭包而不是拼内联 onclick：account 里出现引号会把 HTML 属性截断，
  // 按钮就变成点了没反应 —— 这个 bug 曾让「编辑」整个静默失效。
  $("#savebtn").onclick = () => {
    // 凭据字段被折起来的时候，直接把「姓名不能为空」抛出来等于指向一个
    // 看不见的输入框。先把折叠打开，并把两条路都说出来。
    const missing = credFields.filter(f=>f.required && !(($("#f_"+f.name)||{}).value||"").trim());
    if(missing.length){
      const m=$("#manual"); if(m) m.classList.add("show");
      $("#st").textContent = `先点上面的「连接${d.name}」，或在这里填${missing.map(f=>f.label).join("和")}`;
      return;
    }
    doSave(type, account);
  };
  $("#cancelbtn").onclick = closeModal;
  const ob = $("#oauthbtn");
  // account 非空＝在重新授权一条已存在的连接，把它传下去：授权回来的若是
  // 另一个账号，那是新建而不是修复，必须当场说清楚。
  if(ob) ob.onclick = () => startOAuth(type, null, account || "");
  const ncb = $("#ncbtn");
  if(ncb) ncb.onclick = () => ncDetect();
  if(d.type==='feishu-web') fwInit();
  const scopeToggle = $("#scopetoggle");
  if(scopeToggle) scopeToggle.onclick = () => $("#scopebox").classList.toggle("show");
  const appToggle = $("#apptoggle");
  if(appToggle) appToggle.onclick = () => $("#appbox").classList.toggle("show");
  const manualToggle = $("#manualtoggle");
  if(manualToggle) manualToggle.onclick = () => $("#manual").classList.toggle("show");
  const advToggle = $("#advtoggle");
  if(advToggle) advToggle.onclick = () => $("#adv").classList.toggle("show");
  // 没有预设主机的渠道（通用的企业邮箱）：填完邮箱地址后自动猜主机。
  // 「我公司的 IMAP 主机叫什么」是用户答不出的问题，而大多数自建服务器就是
  // mail.<域名>。只在主机还空着时填，绝不覆盖用户已经输入的东西。
  const addrEl = $("#f_" + d.accountField);
  const needsHosts = d.fields.some(f => f.name === "imapHost" && f.required);
  if(addrEl && needsHosts){
    addrEl.onblur = async () => {
      const ih = $("#f_imapHost"), sh = $("#f_smtpHost");
      if(!addrEl.value || (ih && ih.value) || (sh && sh.value)) return;
      const g = await api("/api/mail/guess", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({address: addrEl.value})});
      if(g.imapHost && ih && !ih.value) ih.value = g.imapHost;
      if(g.smtpHost && sh && !sh.value) sh.value = g.smtpHost;
      if(g.imapHost) toast("ok", "已按域名猜了服务器地址", "猜错了可以直接改");
    };
  }
  if(account){const af=$("#f_"+d.accountField); if(af){af.readOnly=true; af.style.opacity=.6}}
  $("#mask").classList.add("show");
}

function collect(type){
  const d = DESCRIPTORS.find(x=>x.type===type);
  const values={};
  d.fields.forEach(f=>{
    const el=document.getElementById("f_"+f.name); if(!el)return;
    values[f.name] = f.kind==="bool" ? (el.checked?"true":"false") : el.value;
  });
  return {d,values};
}

// ── 飞书网页文档（浏览器扩展） ───────────────────────────────
// 释放扩展、生成配对码、看连接状态和首次读取自检。自检里的几个标志是原值：
// 用户随便打开一篇禁止复制的文档，就能在这里看到 copyable=false，复核拒读信号。
const fwPost = (path) => api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
let FW_TIMER = null;

function fwInit(){
  $("#fwextract").onclick = async () => {
    const r = await fwPost("/api/feishu-web/extract");
    $("#fwdir").innerHTML = r.error ? esc(r.error) : `已释放到 <code>${esc(r.dir)}</code>`;
  };
  $("#fwpair").onclick = async () => {
    const r = await fwPost("/api/feishu-web/pair");
    $("#fwcode").textContent = r.error || r.code;
  };
  clearInterval(FW_TIMER);
  fwStatus();
  FW_TIMER = setInterval(() => { if(!$("#fwstatus")){ clearInterval(FW_TIMER); return; } fwStatus(); }, 3000);
}

async function fwStatus(){
  const r = await api("/api/feishu-web/status");
  const el = $("#fwstatus"); if(!el) return;
  const st = r.status || {};
  const flag = v => v===true ? "true" : v===false ? "false" : "缺失";
  const chk = (c, label) => !c ? "" : `<div>${label}：${esc(c.host||"")} · PageMain ${c.pageMain?"有":"没有"}
    · copyable=${flag(c.flags&&c.flags.copyable)} · exportable=${flag(c.flags&&c.flags.exportable)}
    · isForceSetSecurity=${flag(c.flags&&c.flags.isForceSetSecurity)} · 顶层块 ${Number(c.topChildren)||0}
    · 未加载块 ${Number(c.pendingBefore)||0}→${Number(c.pendingAfter)||0} · 滚动 ${Number(c.scrollRounds)||0} 轮</div>`;
  const conn = st.conn || {};
  el.innerHTML = (st.connected
      ? `✅ 扩展已连接（${esc(conn.version||"")}${conn.installType?" · "+esc(conn.installType):""}）`
      : (r.paired ? "扩展还没连上：确认已加载扩展、填了配对码，并且浏览器开着" : "还没配对"))
    + chk(st.firstCheck, "首次读取自检") + chk(st.lastCheck, "最近一次读取")
    + schk(st.firstSearch, "首次检索自检") + schk(st.lastSearch, "最近一次检索");
}

// 检索自检：只有计数、路径和 class 名（认不出结果结构时用来排查），没有结果内容。
function schk(c, label){
  if(!c) return "";
  return `<div>${label}：${esc(c.host||"")}${esc(c.path||"")} · ${c.login?"跳到了登录页":"已登录"}
    · 搜索框 ${c.inputFound?"有":"没有"}${c.typed?"（填过关键词）":""} · 策略 ${esc(c.strategy||"-")}
    · 链接 ${Number(c.anchors)||0} · 结果 ${Number(c.candidates)||0}${c.emptyHint?" · 页面提示无结果":""}
    · 等了 ${Number(c.waitedMs)||0} ms${(c.classes||[]).length?` · class 样本 <code>${esc(c.classes.join(" | "))}</code>`:""}</div>`;
}

// ── NapCat 自动配置 ───────────────────────────────────────────
// 用户只给一个文件夹地址，剩下的服务端做：读出 QQ 号、打开 HTTP 接口、
// 把 host 收到回环、生成令牌、启动 NapCat，然后把三个字段填好。
//
// 每一步都把服务端做了什么说出来（改了哪个文件、备份在哪、跑了什么命令）：
// 这是在动用户机器上**另一个程序**的配置，不该是个黑盒。
let NC = null;

const ncPost = (path, body) => api(path, {method:"POST",
  headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});

async function ncDetect(){
  const dir = $("#ncdir").value.trim();
  const panel = $("#ncpanel");
  // 留空是正当用法：服务端会去这个系统的常见位置找（mac 上那个路径被 QQ 的
  // 沙箱容器固定在七十来字符，让用户手打它是荒谬的）。
  panel.innerHTML = `<div class="help">${dir?"正在看这个文件夹…":"正在常见位置里找 NapCat…"}</div>`;
  const r = await ncPost("/api/napcat/detect", {dir});
  // 报错里有换行（「试过哪些位置」那几行），不保留换行会挤成一团
  if(!r.ok){ panel.innerHTML = `<div class="st bad" style="white-space:pre-wrap">${esc(r.error)}</div>`; return; }
  // 用服务端认定的那个目录，而不是输入框里的 —— 自动找到时输入框是空的
  NC = {dir:r.install.root, install:r.install, cmd:r.command, qq:(r.install.accounts[0]||{}).qq};
  ncRender();
}

function ncAccount(){ return (NC.install.accounts||[]).find(a=>a.qq===NC.qq) || {}; }

function ncRender(extra){
  const panel = $("#ncpanel"), accs = NC.install.accounts||[], a = ncAccount();
  const state = a.answering && a.hasToken ? "已就绪"
    : a.httpEnabled ? (a.hasToken ? "接口已开，但没在运行" : "接口已开，但没设令牌")
    : "接口没开";
  // host 是 0.0.0.0 的话同局域网的人也连得上，而那个口子能用这个 QQ 发消息。
  const hostWarn = a.host === "0.0.0.0"
    ? `<div class="help" style="color:var(--warn)">它现在监听 0.0.0.0，同一局域网的人也连得上 —— 会帮你收到 127.0.0.1</div>` : "";
  const pick = accs.length > 1
    ? `<div class="field" style="margin:8px 0 0"><label>用哪个 QQ</label>
         <select id="ncqq">${accs.map(x=>`<option value="${esc(x.qq)}" ${x.qq===NC.qq?"selected":""}>${esc(x.qq)}</option>`).join("")}</select></div>` : "";
  const noLauncher = NC.install.launcher ? ""
    : `<div class="help" style="color:var(--warn)">这个文件夹里没有认识的启动器，所以配置完要你自己启动 NapCat。
         macOS 上本来就没有：用 NapCat-Mac-Installer 那个安装器里的「启动 NapCat」。</div>`;

  panel.innerHTML = `
    <div class="help" style="margin-top:8px">✅ 找到 NapCat · 配置目录 <code>${esc(NC.install.configDir)}</code></div>
    <div class="help">QQ <b>${esc(a.qq||"?")}</b> · HTTP 接口${esc(state)} · 端口 ${a.port||3000}</div>
    ${hostWarn}${pick}${noLauncher}
    <button id="ncgo" class="primary" style="margin-top:8px">开启接口并填好表单</button>
    <div id="ncout">${extra||""}</div>`;
  const sel = $("#ncqq");
  if(sel) sel.onchange = () => { NC.qq = sel.value; ncRender(); };
  $("#ncgo").onclick = ncConfigure;
}

async function ncConfigure(){
  const out = $("#ncout"), btn = $("#ncgo");
  btn.disabled = true;
  out.innerHTML = `<div class="help">正在写 NapCat 的配置…</div>`;
  const r = await ncPost("/api/napcat/configure", {dir:NC.dir, qq:NC.qq});
  btn.disabled = false;
  if(!r.ok){ out.innerHTML = `<div class="st bad">${esc(r.error)}</div>`; return; }
  const res = r.result;
  ncFill(NC.qq, res.token, res.endpoint);
  const did = res.backupPath
    ? `已开启 HTTP 接口、host 收到 127.0.0.1${res.tokenKept?"、沿用原有令牌":"、生成了新令牌"}。
       原配置备份在 <code>${esc(res.backupPath)}</code>`
    : `它本来就是这么配的，一个字节都没改${res.tokenKept?"，令牌沿用现成的":""}`;
  if(!res.needsRestart){
    out.innerHTML = `<div class="st ok">✅ ${did}</div>
      <div class="help">三个字段已填好，点下面「测试并保存」即可</div>`;
    return;
  }
  // 配置文件是 NapCat 启动时读的，所以改完必须重启才生效。
  // 它还在跑的话我们不去杀它 —— 那是用户的 QQ，关不关由他决定。
  const live = ncAccount().answering;
  out.innerHTML = `<div class="st ok">✅ ${did}</div>
    ${live ? `<div class="help" style="color:var(--warn)">NapCat 正在用<b>旧配置</b>运行。请先关掉它的窗口，再点下面这个按钮</div>`
           : `<div class="help">配置文件是 NapCat 启动时读的，所以还要重启一次</div>`}
    ${NC.install.launcher
      ? `<button id="ncstart" style="margin-top:8px">启动 NapCat（不用再扫码）</button>
         <div class="help">会跑：<code>${esc(NC.cmd||"")}</code></div>`
      : `<div class="help">自己双击 NapCat 的启动器，起来之后点下面「测试并保存」</div>`}
    <div id="ncstartout"></div>`;
  const sb = $("#ncstart");
  if(sb) sb.onclick = ncStart;
}

async function ncStart(){
  const out = $("#ncstartout"), btn = $("#ncstart");
  btn.disabled = true;
  out.innerHTML = `<div class="help">正在启动，等它登录完成（要十几秒）…</div>`;
  const r = await ncPost("/api/napcat/start", {dir:NC.dir, qq:NC.qq});
  btn.disabled = false;
  if(!r.ok){
    out.innerHTML = `<div class="st bad">${esc(r.error)}</div>
      ${r.command?`<div class="help">试过的命令：<code>${esc(r.command)}</code></div>`:""}`;
    return;
  }
  if(r.answering){
    out.innerHTML = `<div class="st ok">✅ NapCat 的 HTTP 接口已经在 ${esc(r.endpoint)} 上应答${
      r.started?"":"（它本来就在跑）"}</div>
      <div class="help">点下面「测试并保存」，会真打一次 get_login_info</div>`;
    return;
  }
  // 起了但端口没答：最常见的原因是快速登录没成功，NapCat 又在等扫码。
  out.innerHTML = `<div class="st bad">已经启动它了，但 ${esc(r.endpoint)} 还没有应答</div>
    <div class="help">去 NapCat 的窗口看一眼：如果它在等扫码，用手机扫一下；
      扫完回来点「测试并保存」。跑的命令是 <code>${esc(r.command)}</code></div>`;
}

function ncFill(qq, token, endpoint){
  const set = (id,v) => { const el = document.getElementById(id); if(el && v) el.value = v; };
  set("f_self_id", qq); set("f_token", token); set("f_endpoint", endpoint);
}

// ── OAuth 设备流 ──────────────────────────────────────────────
// 轮询在服务端做（授权服务规定了最小间隔，slow_down 还要加间隔），
// 这里只是每 2 秒问一次状态。
let OAUTH_SESSION = null;

// valuesOverride 非空时用它代替读表单：重新授权是从详情页发起的，那里没有
// 表单，而已保存的设置（尤其写开关）必须原样带上 —— 授权成功后走的是常规
// 保存路径，不带就等于把它们重置成默认值。
async function startOAuth(type, valuesOverride, expectAccount){
  const values = valuesOverride || collect(type).values;
  const dd = DESCRIPTORS.find(x=>x.type===type);
  const cs = dd && dd.oauth && dd.oauth.clientSecret;
  if(cs && !valuesOverride){
    const el = document.getElementById("oc_"+cs.name);
    if(el && el.value.trim()) values[cs.name] = el.value.trim();
  }
  const panel = $("#oauthpanel");
  panel.innerHTML = `<div class="help">正在向授权服务要验证码…</div>`;
  const r = await api("/api/oauth/start",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,values})});
  if(!r.ok){ panel.innerHTML = `<div class="st bad">${esc(r.error||"无法开始授权")}</div>`; return; }

  const s = r.session;
  OAUTH_SESSION = s.id;
  const st0 = await api("/api/oauth/status?session="+encodeURIComponent(s.id));
  renderOAuthStep(type, Object.assign({}, s, st0 && st0.phase ? {phase: st0.phase} : {}));
  pollOAuth(type, s.id, expectAccount);
}
// renderOAuthStep 画出当前这一步要用户做的事。
//
// 飞书是两步（先建应用、再授权），每步有自己的链接；它返回的链接已经带着码，
// 用户打开、在飞书里点确认就行，码只是兜底。别的渠道照旧：复制码 → 去输入。
let OAUTH_STEP = "";
function renderOAuthStep(type, s){
  const panel = $("#oauthpanel");
  if(!panel) return;
  OAUTH_STEP = (s.phase||"") + "|" + (s.userCode||"");
  const openURL = s.verificationUriComplete || s.verificationUri;
  // 只有能一键建应用的渠道（飞书）走两步式的显示；云之家、GitHub 照旧。
  const dd = DESCRIPTORS.find(x=>x.type===type);
  if(dd && dd.oauth && dd.oauth.register){
    const reg = s.phase === "register";
    panel.innerHTML = `
      <div class="oauth-code">
        <div class="help"><b>${reg?"第 1 步，共 2 步：建应用":"第 2 步，共 2 步：确认个人授权"}</b></div>
        <div class="help" style="margin-top:6px">${reg
          ?"点下面的按钮，在飞书里确认在你的企业里创建一个专属应用。企业要求管理员审批的话，等审批通过后回来再点一次连接，不会重复建应用。"
          :"应用已经建好。再点一次下面的按钮，在飞书里确认授权，让它以你本人的身份读写飞书。"}</div>
        <div style="margin-top:8px"><a class="btn primary" href="${esc(openURL)}" target="_blank" rel="noreferrer">${reg?"打开飞书，创建应用":"打开飞书，确认授权"}</a></div>
        ${s.userCode?`<div class="help" style="margin-top:6px">页面要你输验证码的话，填 <code>${esc(s.userCode)}</code></div>`:""}
        <div class="st" id="ost">等待你在飞书里确认…</div>
      </div>`;
    return;
  }
  panel.innerHTML = `
    <div class="oauth-code">
      <div class="help">① 复制这个验证码</div>
      <div class="code-row"><code id="ucode">${esc(s.userCode)}</code>
        <button id="copycode">复制</button></div>
      <div class="help" style="margin-top:8px">② 打开 <a href="${esc(openURL)}" target="_blank" rel="noreferrer">${esc(s.verificationUri)}</a> 粘贴进去并确认</div>
      <div class="st" id="ost">③ 等待授权…</div>
    </div>`;
  $("#copycode").onclick = async () => {
    try{ await navigator.clipboard.writeText(s.userCode); $("#copycode").textContent="已复制"; }
    catch(e){ $("#copycode").textContent="请手动复制"; }
  };
}

async function pollOAuth(type, id, expectAccount){
  const ost = () => $("#ost");
  while(OAUTH_SESSION === id){
    await new Promise(r=>setTimeout(r,2000));
    if(OAUTH_SESSION !== id) return;            // 弹窗已关
    const st = await api("/api/oauth/status?session="+encodeURIComponent(id));
    const el = ost();
    if(!el) return;                              // DOM 没了，停
    if(st.state === "pending"){
      // 阶段换了（建应用 → 授权）：换上新的链接和码。只有两段式的渠道会换阶段。
      if(st.phase && (st.phase + "|" + (st.userCode||"")) !== OAUTH_STEP && st.verificationUri){
        renderOAuthStep(type, st);
      } else if(!(DESCRIPTORS.find(x=>x.type===type)?.oauth?.register)){
        el.className="st"; el.textContent="③ 等待授权…";
      }
      continue;
    }
    if(st.state === "ok"){
      OAUTH_SESSION = null;
      // 重新授权时授权的可能是另一个账号。凭据按账号名定位，所以那会
      // 新建一条连接、旧的那条原封不动留着（仍然是坏的）—— 必须说出来，
      // 否则用户以为修好了，而实际在用的还是过期那条。
      if(expectAccount && st.account && st.account !== expectAccount){
        el.className="st bad";
        el.innerHTML = `授权的是另一个账号「${esc(st.account)}」，已新建为一条连接。`
          + `<br>原来的「${esc(expectAccount)}」没有变化，仍然需要重新授权或删除。`;
        setTimeout(()=>{closeModal();refresh();},4000);
        return;
      }
      el.className="st ok";
      el.textContent = "✅ 已连接为 " + st.account + "，渠道已保存";
      setTimeout(()=>{closeModal();refresh();},1200);
      return;
    }
    el.className="st bad"; el.textContent = "授权失败：" + (st.error||"未知原因");
    // 应用建好了但授权没走完：把 App ID 回填到表单上，下次点连接就接着授权，
    // 而不是再建一个应用（密钥服务端已经记住了）。
    if(st.fill){
      Object.entries(st.fill).forEach(([k,v])=>{ const f=document.getElementById("f_"+k); if(f) f.value=v; });
      const box=$("#appbox"); if(box) box.classList.add("show");
    }
    OAUTH_SESSION = null;
    return;
  }
}

async function doSave(type, account){
  const {d,values} = collect(type);
  const st=$("#st"); st.className="st"; st.textContent="测试连通中…";
  const acc = account || values[d.accountField];
  const t = await api("/api/channels/test",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,account:acc,values})});
  if(!t.ok){ st.className="st bad"; st.textContent="连通失败：" + t.error; return; }
  const r = await api("/api/channels",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,values})});
  if(r.error){ st.className="st bad"; st.textContent="保存失败：" + r.error; return; }
  st.className="st ok"; st.textContent="✅ 已连通并保存";
  setTimeout(()=>{closeModal();refresh();},600);
}

// 测试已保存的渠道。
//
// 原来用 alert()：那是系统对话框，和稿子的视觉完全不搭，而且它是**阻塞**的 ——
// 要点一下「确定」才能继续。测试结果只是一条反馈，不该拦住人。
// 改成行内进行中状态 + 浮层提示。
async function testSaved(type,account){
  const btn = $("#list").querySelector(`[data-test="${type}|${account}"]`);
  const old = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled = true; btn.innerHTML = ic("FlaskConical") + "测试中"; }
  const r = await api("/api/channels/test",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,account,values:{}})});
  if(btn){ btn.disabled = false; btn.innerHTML = old; }
  if(r.ok){
    toast("ok", `${esc(account)} 连通正常` + (r.identity?` · ${esc(r.identity)}`:""));
  }else{
    // 失败原因可能很长（对方服务器原样抛回来的），所以浮层允许换行且停留更久。
    toast("bad", `${esc(account)} 连不上`, r.error);
  }
}

// 重新授权一条已保存的 OAuth 连接。
//
// 为什么必须有这个入口：授权会失效，而失效的原因不止「到期」—— 刷新令牌
// 被吊销、用户在对方系统里解除了授权、换了密码，都会让一条已保存的连接
// 从此不可用，而且没有任何办法从本机把它救回来。没有这个按钮的话，唯一
// 的出路是删掉连接再重新加一遍，那同时会删掉系统密码管理器里的凭据，并且
// 把写开关这些设置一起丢掉。
//
// settings 要原样带上：授权成功后走的是常规保存路径，不带就等于把写开关
// 重置成默认值 —— 用户会发现发消息的工具悄悄不见了。
function reauth(type, account, settings){
  const d = DESCRIPTORS.find(x=>x.type===type);
  const values = Object.assign({}, settings||{});
  values[d.accountField] = account;
  delete values[d.secretField];
  $("#modal").innerHTML = `
    <h3>${ic("Plug","ic-18 ic")} 重新授权</h3>
    <div class="sub">${esc(d?d.name:type)} · ${esc(account)}</div>
    <div class="tiny" style="margin-top:12px">
      会把你送到 ${esc(d&&d.oauth?d.oauth.authHost:"授权服务")} 再确认一次。
      完成后替换本机保存的令牌，其余设置和权限不变。
    </div>
    <div id="oauthpanel" style="margin-top:14px"></div>
    <div class="foot"><button id="rano">取消</button></div>`;
  $("#mask").classList.add("show");
  $("#rano").onclick = closeModal;
  startOAuth(type, values, account);
}

// 删除渠道。
//
// 原来用 confirm()。删除要确认是对的，但它顺带删掉系统密码管理器里的凭据 ——
// 这件事系统对话框说不清楚，所以改成和表单同款的弹窗，把后果写出来。
function del(type,account){
  const d = DESCRIPTORS.find(x=>x.type===type);
  $("#modal").innerHTML = `
    <h3>${ic("Trash","ic-18 ic")} 移除连接</h3>
    <div class="sub">仅移除本机连接与凭据，不会删除你邮箱或对方系统里的任何数据。</div>
    <div class="risk" style="margin-top:16px">
      <b>${esc(d?d.name:type)} · ${esc(account)}</b>
      同时会删除它在${esc(SECRET_BACKEND||"系统密码管理器")}里的凭据。
      之后要再用这个账号，需要重新填一次。
    </div>
    <div class="foot">
      <button class="danger" id="delok">${ic("Trash")}删除此连接</button>
      <button id="delno">取消</button>
      <span class="st" id="delst"></span>
    </div>`;
  $("#mask").classList.add("show");
  $("#delno").onclick = closeModal;
  $("#delok").onclick = async () => {
    const b = $("#delok"); b.disabled = true;
    const r = await api("/api/channels/delete",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({type,account})});
    if(r && r.error){
      b.disabled = false;
      $("#delst").className = "st bad"; $("#delst").textContent = r.error;
      return;
    }
    closeModal(); refresh();
    toast("ok", `已移除 ${esc(account)}`);
  };
}

// toast 是页面自己的浮层提示，替掉 alert()。
//
// 不阻塞、自动消失、可手动关；失败的那条停留更久并允许换行 —— 失败原因常常是
// 对方服务器原样抛回来的一长句，截断了就等于没说。
let TOAST_TIMER = null;
function toast(kind, title, detail){
  let box = $("#toast");
  if(!box){
    box = document.createElement("div");
    box.id = "toast"; box.className = "toast";
    document.body.appendChild(box);
  }
  box.className = "toast show " + kind;
  box.innerHTML = `${ic(kind==="ok"?"ShieldCheck":"CircleHelp","ic-16 ic")}
    <div><div class="t">${title}</div>${detail?`<div class="d">${esc(detail)}</div>`:""}</div>
    <button class="x" aria-label="关闭">×</button>`;
  box.querySelector(".x").onclick = () => box.className = "toast";
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(()=>{ box.className = "toast"; }, detail ? 9000 : 3500);
}

$("#mask").onclick=(e)=>{if(e.target.id==="mask")closeModal()};

// ── 详情页 ───────────────────────────────────────────────────
// 稿子把它画成独立页面（面包屑 + 三个标签 + 左 832 / 右 336）。实现上它是同一个
// 页面的另一个视图，用 hash 路由 —— 没有后端路由，刷新也能回到同一处。
//
// 稿子只画了「QQ 邮箱」这一个渠道。实现必须按描述符渲染：其他渠道字段差别很大
// （NapCat 有自动配置、云之家是扫码授权），照着那一个硬写会在第二个渠道上崩。

let DETAIL = null;   // {type, account, tab}
let CHECK = null;    // 最近一次分步检查结果

function parseHash(){
  const m = location.hash.match(/^#\/c\/([^/]+)\/([^/]+)(?:\/(\w+))?$/);
  if(!m) return null;
  return {type:decodeURIComponent(m[1]), account:decodeURIComponent(m[2]), tab:m[3]||"account"};
}

function go(type, account, tab){
  location.hash = `#/c/${encodeURIComponent(type)}/${encodeURIComponent(account)}/${tab||"account"}`;
}
function goList(){
  // 不能只写 location.hash = ""：那样浏览器只把 #/x 剥成 #，不算一次变化，
  // hashchange 不触发，于是面包屑点了没反应。显式清掉地址再自己走一次路由。
  if(location.hash) history.replaceState(null, "", location.pathname + location.search);
  route();
}

function route(){
  DETAIL = parseHash();
  const det = $("#detailview"), list = $("#listview");
  if(DETAIL){
    const inst = CHANNELS.find(v=>v.descriptor.type===DETAIL.type && v.instance.account===DETAIL.account);
    if(!inst){ goList(); return; }   // 删掉之后回列表，别停在一个空页面
    list.hidden = true; det.hidden = false;
    renderDetail(inst);
  }else{
    det.hidden = true; list.hidden = false;
    CHECK = null;
  }
}

function renderDetail(v){
  const d = v.descriptor, i = v.instance;
  const tab = DETAIL.tab;
  const wOn = writeOn(d, i);
  const active = activeTools(v);

  const tabs = [["account","账号配置"],["perm","权限与工具"],["mcp","接入信息"]];
  $("#detailview").innerHTML = `
    <section>
      <div class="bc">
        <a href="#" id="bcback">${ic("ArrowLeft")}连接与配置</a>
        ${ic("ChevronRight")}<span>${esc(d.name)}</span>
      </div>
      <div class="dt-head">
        <span class="dt-ico">${ic(iconOf(d.type),"ic-18 ic")}</span>
        <div>
          <div class="dt-title">${esc(d.name)}
            <span class="pill ok">已配置</span>
            ${d.version?`<span class="tag">v${d.version}</span>`:""}</div>
          <div class="dt-sub">${esc(i.account)}</div>
        </div>
      </div>
      <div class="dtabs">
        ${tabs.map(([k,t])=>`<a href="#" data-tab="${k}" class="${tab===k?'on':''}">${t}</a>`).join("")}
      </div>
    </section>

    <div class="cols">
      <div style="display:flex;flex-direction:column;gap:24px;min-width:0" id="dmain"></div>
      <aside style="display:flex;flex-direction:column;gap:24px" id="dside"></aside>
    </div>`;

  $("#bcback").onclick = e => { e.preventDefault(); goList(); };
  $("#detailview").querySelectorAll("[data-tab]").forEach(a=>{
    a.onclick = e => { e.preventDefault(); go(d.type, i.account, a.dataset.tab); };
  });

  renderDetailMain(v, tab, {writeOn: wOn, active});
  renderDetailSide(v, {writeOn: wOn, active});
}

function renderDetailMain(v, tab, st){
  const d = v.descriptor, i = v.instance;
  const box = $("#dmain");

  if(tab === "account"){
    // 账号配置：按描述符渲染，基础字段在前、高级（主机/端口）折起来。
    // 稿子把服务器设置单独成一块并标「SSL / TLS 加密」—— 那是事实，保留。
    const basic = d.fields.filter(f=>!f.advanced && f.kind!=="bool");
    const adv   = d.fields.filter(f=>f.advanced);
    box.innerHTML = `
      <section class="card pad24">
        <div class="sec-head"><h2>账号配置</h2>
          <span class="meta">${esc(d.summary)}</span></div>
        <div id="dfields">${basic.map(f=>detailField(f,i,d.accountField)).join("")}</div>
        ${adv.length?`
          <div class="hsep"></div>
          <div class="sec-head" style="margin-bottom:12px">
            <h2>服务器设置</h2>
            <span class="meta">${ic("LockKeyhole")} SSL / TLS 加密</span></div>
          <div class="dgrid">${adv.map(f=>detailField(f,i,d.accountField)).join("")}</div>`:""}
      </section>
      <div class="dsave">
        <span class="tiny">${ic("LockKeyhole")} 凭据保存在本机，界面中保持隐藏</span>
        <button id="dcancel">取消</button>
        <button class="primary" id="dsave">保存配置</button>
        <span class="st" id="dst"></span>
      </div>`;
    $("#dcancel").onclick = goList;
    $("#dsave").onclick = () => saveDetail(d, i.account);
    return;
  }

  if(tab === "perm"){
    // 权限与工具：稿子把「权限」和「工具清单」分成两块，而且对关掉的工具
    // 说明原因（「需开启『允许发送邮件』」）——光标一个「未注册」没用。
    const sw = d.fields.filter(f=>f.kind==="bool");
    const info = d.toolInfo || (d.tools||[]).map(n=>({name:n,title:n}));
    const onNames = new Set(st.active);
    box.innerHTML = `
      <section class="card pad24">
        <div class="sec-head"><h2>访问权限</h2>
          <span class="meta">遵循最小权限原则，默认仅开放读取能力。</span></div>
        <div class="prow">
          <span class="pico">${ic("ShieldCheck","ic-16 ic")}</span>
          <div><div class="pt">只读访问</div>
            <div class="pd">${readTitles(d) || "无只读工具"}</div></div>
          <span class="pill">默认启用</span>
        </div>
        ${sw.map(f=>{
          const on = i.settings?.[f.name]==="true";
          return `<div class="prow">
            <span class="pico">${ic("Send","ic-16 ic")}</span>
            <div><div class="pt">${esc(f.label)}</div>
              <div class="pd">${esc(f.help||"")}</div>
              ${writeTitles(d)?`<div class="pd">这些工具受它控制：${writeTitles(d)}</div>`:""}</div>
            <label class="sw"><input type="checkbox" data-sw="${esc(f.name)}" ${on?"checked":""}>
              <span>${on?"已开启":"已关闭"}</span></label>
          </div>`;
        }).join("")}
      </section>

      <section class="card pad24">
        <div class="sec-head"><h2>渠道工具</h2>
          <span class="meta">${st.active.length} 个已启用${info.length>st.active.length?` · ${info.length-st.active.length} 个因权限关闭`:""}</span>
          <span class="pill">${info.length} 个工具</span></div>
        <div class="tools">
          ${info.map(t=>{
            const on = onNames.has(t.name);
            return `<div class="trow">
              <span class="tmark ${on?'on':''}">${ic(on?"Check":"LockKeyhole")}</span>
              <div class="tmain"><div class="tt">${esc(t.title)}</div>
                <div class="tn mono">${esc(t.name)}</div></div>
              <div class="td">${esc(t.desc||"")}</div>
              <span class="pill ${on?'ok':''}">${on?"已启用":"未注册"}</span>
            </div>`;
          }).join("")}
        </div>
      </section>
      <div class="dsave">
        <span class="tiny">${ic("LockKeyhole")} 改完要保存，并在客户端刷新工具</span>
        <button class="primary" id="dsave2">保存配置</button>
        <span class="st" id="dst"></span>
      </div>`;
    $("#dsave2").onclick = () => saveSwitches(d, i.account);
    box.querySelectorAll("[data-sw]").forEach(cb=>{
      cb.onchange = () => cb.nextElementSibling.textContent = cb.checked ? "已开启" : "已关闭";
    });
    return;
  }

  // 接入信息：这个渠道在 MCP 里长什么样。
  box.innerHTML = `
    <section class="card pad24">
      <div class="sec-head"><h2>接入信息</h2>
        <span class="meta">这个渠道在客户端里以什么形式出现</span></div>
      <div class="kv"><span class="k">渠道标识</span><span class="v mono">${esc(d.type)}</span></div>
      <div class="kv"><span class="k">账号</span><span class="v">${esc(i.account)}</span></div>
      <div class="kv"><span class="k">当前权限</span><span class="v">${st.writeOn?"可写":"只读"}</span></div>
      <div class="kv"><span class="k">本渠道启用工具</span><span class="v">${st.active.length} 个</span></div>
      <div class="hsep"></div>
      <div class="tiny" style="margin-bottom:8px">模型会看到这些工具名：</div>
      <div class="chips">${st.active.map(n=>`<span class="chip mono">${esc(n)}</span>`).join("")}</div>
      <div class="hsep"></div>
      <div class="note-box">${ic("CircleHelp")}
        <div><b>保存后，记得更新 MCP 配置</b>
          <div>权限变更不会自动同步到客户端。返回配置页生成，并在 Amazon Quick 中刷新。</div>
          <a href="#" id="tomcp">前往生成 MCP 配置 →</a></div></div>
    </section>`;
  $("#tomcp").onclick = e => {
    e.preventDefault(); goList();
    setTimeout(()=>$("#onboard").scrollIntoView({behavior:"smooth",block:"center"}), 60);
  };
}

// detailField 渲染账号配置页的一个字段。
//
// accountField 从 descriptor 传进来，而不是去 instance 上找：账号字段的名字是
// 渠道的属性（邮件渠道叫 user，Jira 叫 email），instance 上压根没有这个字段 ——
// 读它得到 undefined，于是条件永远不成立，字段值会落到错误的分支。
// 原来还硬编码了一个 "user" 来兜，那只是让邮件渠道看起来是对的。
// readTitles 把只读工具的标题列成一句话。
//
// 稿子上这里写的是「查看最近邮件、搜索邮件、读取邮件内容」—— 那是邮件渠道的
// 具体工具名，不是「3 个只读工具」这种数字。数字说不出用户授权了什么，而这一行
// 的全部用意就是让人看懂「只读」到底包含哪些事。
//
// 所以从 toolInfo 生成，对每个渠道都成立：Jira 会列出「当前身份、列出项目、
// 搜索事项…」。超过四个就截断，否则这一行会把卡片撑开。
// writeTitles 列出受写开关控制的工具。
//
// 一个开关控制哪几个工具，必须在开关旁边说出来 —— 「允许写入操作」这个标签本身
// 不告诉用户它会放开什么。这是不可逆动作的授权，含糊不得。
function writeTitles(d){
  const info = d.toolInfo || [];
  const titles = info.filter(t => t.write).map(t => t.title);
  return titles.map(esc).join("、");
}

function readTitles(d){
  const info = d.toolInfo || [];
  const titles = info.filter(t => !t.write).map(t => t.title);
  if(!titles.length) return "";
  const shown = titles.slice(0, 4).map(esc).join("、");
  return titles.length > 4 ? `${shown} 等 ${titles.length} 项` : shown;
}

function detailField(f, inst, accountField){
  const val = f.name === accountField
    ? inst.account                                   // 账号本身存在 instance.account 上
    : (inst.settings?.[f.name] ?? f.default ?? "");
  if(f.kind==="password"){
    return `<div class="field"><label>${esc(f.label)}
        <span class="secret-tag">${ic("LockKeyhole")}已安全保存</span></label>
      <input type="password" id="df_${f.name}" placeholder="留空表示不修改">
      ${f.help?`<div class="help">${esc(f.help)}</div>`:""}</div>`;
  }
  const t = f.kind==="number" ? "number" : "text";
  return `<div class="field"><label>${esc(f.label)}${f.required?' <span style="color:var(--status-danger-foreground)">*</span>':""}</label>
    <input type="${t}" id="df_${f.name}" value="${esc(val)}" placeholder="${esc(f.placeholder||"")}">
    ${f.help?`<div class="help">${esc(f.help)}</div>`:""}</div>`;
}

// 右栏：连接检查 / 接入摘要 / 配置帮助 / 移除连接 —— 稿子的四块。
function renderDetailSide(v, st){
  const d = v.descriptor, i = v.instance;
  const steps = CHECK && CHECK.key===`${d.type}|${i.account}` ? CHECK.steps : null;
  const running = CHECK && CHECK.key===`${d.type}|${i.account}` && CHECK.running;
  $("#dside").innerHTML = `
    <section class="card">
      <div class="sec-head"><h2>连接检查</h2>
        <span class="pill ${steps?(steps.every(s=>s.state==="ok")?"ok":""):""}">
          ${running?"检查中":(steps?(steps.every(s=>s.state==="ok")?"全部通过":"有问题"):"尚未测试")}</span></div>
      <div class="tiny">配置已保存不代表连接可用。测试仅检查服务与凭据，不会发送邮件。</div>
      <div class="checks">${(steps||placeholderSteps(d)).map(s=>`
        <div class="crow">
          <span class="cmark ${s.state||''}">${ic(s.state==="ok"?"Check":(s.state==="fail"?"CircleHelp":"CircleDashed"))}</span>
          <div class="cmain"><div>${esc(s.label)}</div>
            ${s.error?`<div class="cerr">${esc(s.error)}</div>`:""}
            ${s.note?`<div class="cnote">${esc(s.note)}</div>`:""}</div>
          <span class="tiny">${s.state==="ok"?s.tookMs+"ms":(s.state==="fail"?"失败":(s.state==="skip"?"已跳过":"待检查"))}</span>
        </div>`).join("")}</div>
      <button class="block" id="dcheck" ${running?"disabled":""} style="margin-top:12px">
        ${ic("FlaskConical")}${running?"检查中…":"测试连接"}</button>
    </section>

    <section class="card">
      <div class="sec-head"><h2>MCP 接入摘要</h2></div>
      <div class="kv"><span class="k">渠道标识</span><span class="v mono">${esc(d.type)}</span></div>
      <div class="kv"><span class="k">账号</span><span class="v">${esc(i.account)}</span></div>
      <div class="kv"><span class="k">当前权限</span><span class="v">${st.writeOn?"可写":"只读"}</span></div>
      <div class="kv"><span class="k">本渠道启用工具</span><span class="v">${st.active.length} 个</span></div>
      <div class="hsep"></div>
      <div class="cl-head" style="font-size:11px">${ic("Monitor")}
        <span style="font-weight:600">Amazon Quick</span>
        <span class="pill ${LASTCLIENT?"ok":""}">${LASTCLIENT?"已连接":"未连接"}</span></div>
      <div class="tiny" style="margin-top:7px">
        ${LASTCLIENT
          ? `客户端最近一次注册 ${LASTCLIENT.tools||0} 个工具（${ago(LASTCLIENT.at)}），与当前配置分开统计。`
          : "还没有任何客户端连接过。"}</div>
      <div class="note-box" style="margin-top:12px">${ic("CircleHelp")}
        <div><b>保存后，记得更新 MCP 配置</b>
          <div>权限变更不会自动同步到客户端。</div></div></div>
    </section>

    <section class="card">
      <div class="sec-head"><h2>连接遇到问题？</h2></div>
      <div class="tiny">${esc(d.fields.find(f=>f.kind==="password")?.help || "按渠道说明检查账号与凭据。")}</div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:7px">
        ${d.helpUrl?`<a href="${esc(d.helpUrl)}" target="_blank" rel="noreferrer">${esc(d.name)}配置指南 ↗</a>`:""}
        <a href="/api/log" target="_blank">查看运行日志 ↗</a>
      </div>
    </section>

    ${d.oauth?`
    <section class="card">
      <div class="sec-head"><h2>授权状态</h2>${authPill(v.auth)}</div>
      ${authDetail(v.auth, d)}
      <button class="block" id="dreauth" style="margin-top:12px">${ic("Plug")}重新授权</button>
    </section>`:""}

    <section class="card">
      <div class="sec-head"><h2>移除连接</h2></div>
      <div class="tiny">仅删除本机连接与凭据，不会删除对方系统里的任何数据。</div>
      <button class="danger block" id="ddel" style="margin-top:12px">${ic("Trash")}删除此连接</button>
    </section>`;
  $("#dcheck").onclick = () => runCheck(d.type, i.account);
  $("#ddel").onclick = () => del(d.type, i.account);
  if($("#dreauth")) $("#dreauth").onclick = () => reauth(d.type, i.account, i.settings);
}

// 没测过时也要把三条列出来，让用户知道会检查什么 —— 稿子上就是「待检查」。
function placeholderSteps(d){
  if(d.kind === "mail"){
    return [{label:"IMAP 服务可达性"},{label:"邮箱凭据验证"},{label:"SMTP 服务可达性"}];
  }
  return [{label:"连接与凭据验证"}];
}

async function runCheck(type, account){
  CHECK = {key:`${type}|${account}`, running:true, steps:null};
  route();
  const r = await api("/api/channels/check",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type,account,values:{}})});
  if(r.error){
    CHECK = {key:`${type}|${account}`, running:false, steps:null};
    toast("bad", "检查没能进行", r.error);
  }else{
    CHECK = {key:`${type}|${account}`, running:false, steps:r.steps||[]};
    const bad = (r.steps||[]).filter(s=>s.state==="fail");
    if(!bad.length) toast("ok", `${account} 全部检查通过`);
    else toast("bad", `${bad[0].label}未通过`, bad[0].error);
  }
  route();
}

async function saveDetail(d, account){
  const st = $("#dst"); st.className="st"; st.textContent="测试连通中…";
  const values = {};
  d.fields.forEach(f=>{
    const el = document.getElementById("df_"+f.name);
    if(el && el.value !== "") values[f.name] = el.value;
  });
  // 账号字段不能改（它是凭据的键），但必须带上
  values[d.accountField] = account;
  const t = await api("/api/channels/test",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type:d.type,account,values})});
  if(!t.ok){ st.className="st bad"; st.textContent="连不上：" + t.error; return; }
  const r = await api("/api/channels",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type:d.type,values})});
  if(r.error){ st.className="st bad"; st.textContent="保存失败：" + r.error; return; }
  st.className="st ok"; st.textContent="已保存";
  await refresh(); route();
  toast("ok", "已保存并验证连通");
}

async function saveSwitches(d, account){
  const st = $("#dst"); st.className="st"; st.textContent="保存中…";
  const values = {};
  $("#dmain").querySelectorAll("[data-sw]").forEach(cb=>{ values[cb.dataset.sw] = cb.checked ? "true" : "false"; });
  values[d.accountField] = account;
  const r = await api("/api/channels",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({type:d.type,values})});
  if(r.error){ st.className="st bad"; st.textContent="保存失败：" + r.error; return; }
  st.className="st ok"; st.textContent="已保存";
  await refresh(); route();
  toast("ok", "权限已更新 · 记得在客户端刷新工具");
}

window.addEventListener("hashchange", route);

boot();
</script>
</body>
