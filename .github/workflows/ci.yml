# 三平台构建与测试。
#
# 为什么要三个平台的 runner：**构建**其实不需要 —— 全程 CGO_ENABLED=0 的纯 Go，
# 一台 Linux 就能交叉编译出全部五个目标。三个 runner 要解决的是另外三件事：
#
#   1. 在每个操作系统上真的跑一遍测试（凭据后端、路径、UserConfigDir 的基准
#      目录三者在三个平台上完全不同，只在 macOS 上绿不说明 Windows 上能用）
#   2. 以后做原生安装包（MSI 要 Windows，dmg / pkg 要 macOS）
#   3. 以后做代码签名（Windows 签名和 Apple 公证都必须在对应平台上做）
#
# 所以这里的分工是：test 用三平台矩阵，build 只在 Linux 上做交叉编译。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不打断其他平台：三个平台的失败往往互相独立，
      # 一次就把三份结果都看到比逐个试快得多。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # wasm 插件的测试要先有模块。这一步不用 plugins/build.sh：那是个
      # bash 脚本，在 Windows runner 上要靠 Git Bash 和 du，没必要赌。
      - name: 构建 wasm 插件模块
        shell: bash
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          mkdir -p plugins/dist/ghwasm
          go build -buildmode=c-shared -o plugins/dist/ghwasm/ghwasm.wasm ./plugins/ghwasm

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      # 只在 Linux 上查：格式是平台无关的，跑三遍纯属浪费。而且它必须排在
      # 测试**后面** —— 这一步失败过一次，把 Windows 上的测试整个挡掉了，
      # 结果是「Windows 红了，但我们不知道测试本身能不能过」。
      - name: gofmt 检查
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "下面这些文件没有 gofmt 过："
            echo "$unformatted"
            exit 1
          fi

  build:
    name: 交叉编译五平台
    runs-on: ubuntu-latest
    needs: test
    # 日常开发只跑测试。交叉编译 + 打包要 4 分钟，而它们在非 tag 构建上产出的
    # 版本号是 0.0.0-dev+<sha>，谁也不会拿去用 —— 为一堆没人下载的产物等 4 分钟
    # 不值得。
    #
    # 代价是 Inno Setup 的安装包脚本没有任何测试覆盖（测试矩阵三平台只编译宿主
    # 架构），改了 packaging/ 之后要到打 tag 那一刻才知道坏没坏。所以保留
    # workflow_dispatch：手动跑一次就是发布前演练，跑 ①②③ 而不发布
    # （④⑤ 另有 tag 判断）。改 packaging/ 之后请先手动跑一次再打 tag。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tag 推上来就用 tag 名当版本号，其他情况用 0.0.0-dev+<短 sha>，
      # 这样从任何一个产物都能倒推出它是哪次提交。
      - name: 确定版本号
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # release.sh 默认用 goproxy.cn —— 那是为开发机准备的（本机到
      # proxy.golang.org 的 DNS 不通）。CI 上走官方的。
      - name: 打发布包
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: VERSION="${{ steps.ver.outputs.version }}" ./packaging/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-hub-${{ steps.ver.outputs.version }}
          path: |
            dist/pkg/*.zip
            dist/pkg/SHA256SUMS.txt
          retention-days: 30

  installer-windows:
    name: Windows 安装包
    runs-on: windows-latest
    needs: build
    # 和 build 同一个条件：它 needs build，build 被跳过时它本来也不会跑，
    # 但写出来才看得懂「日常构建为什么没有安装包」。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      # 用 build 这一步的产物，而不是在这台 runner 上重新编译 —— 这样
      # zip 里的 exe 和安装包里的 exe 是同一个二进制，排查问题时不用怀疑
      # 「这两个是不是同一次构建」。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-hub-*
          merge-multiple: true
          path: artifacts

      - name: 解出 Windows amd64 的内容
        shell: bash
        run: |
          mkdir -p stage
          zip=$(ls artifacts/mcp-hub-*-windows-amd64.zip)
          unzip -q "$zip" -d unpacked
          # zip 里是 mcp-hub-<版本>-windows-amd64/ 这一层目录
          cp unpacked/*/mcp-hub.exe stage/
          cp unpacked/*/快速开始.md stage/
          # 许可与归属声明：从 zip 里取，而不是从 checkout 里取 —— 这样
          # 安装包装进去的和 zip 里分发的是同一份文件。缺了会让 iscc 失败，
          # 那正是想要的：分发缺许可证是合规问题，不该静默通过。
          cp unpacked/*/LICENSE unpacked/*/NOTICE unpacked/*/THIRD-PARTY-NOTICES.md stage/
          ls -l stage

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          zip=$(ls artifacts/mcp-hub-*-windows-amd64.zip)
          base=$(basename "$zip" -windows-amd64.zip)
          version=${base#mcp-hub-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # VersionInfoVersion 必须是 x.x.x.x 的纯数字形式，
          # 而 dev 构建的版本号形如 0.0.0-dev+abc1234，塞不进去。
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "verinfo=${version}.0" >> "$GITHUB_OUTPUT"
          else
            echo "verinfo=0.0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: 装 Inno Setup
        run: choco install innosetup --no-progress -y

      # Inno Setup 自带的语言包里**没有简体中文** —— 它在 issrc 仓库里单独
      # 放着，不随安装程序分发。不取这个文件，安装包就只能是英文界面，而
      # 用户是中文办公环境里的财务和运营。
      #
      # 取不到就让这一步失败，不要静默退回英文：那样中文用户会拿到一个英文
      # 安装包，而没有人会发现。
      - name: 取简体中文语言包
        shell: bash
        run: |
          dest="/c/Program Files (x86)/Inno Setup 6/Languages/ChineseSimplified.isl"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" \
            -o "$dest"
          head -1 "$dest"
          test -s "$dest"

      - name: 编译安装包
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DAppVersion=${{ steps.ver.outputs.version }} ^
            /DVersionInfo=${{ steps.ver.outputs.verinfo }} ^
            /DSourceDir=%CD%\stage ^
            packaging\windows\mcp-hub.iss

      - name: 校验和
        shell: bash
        run: |
          cd stage/out
          sha256sum ./*.exe > SHA256SUMS-setup.txt
          cat SHA256SUMS-setup.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-hub-setup-${{ steps.ver.outputs.version }}
          path: |
            stage/out/*.exe
            stage/out/SHA256SUMS-setup.txt
          retention-days: 30

  publish-s3:
    name: 上传公开下载地址
    # GitHub Release 解决不了客户下载：仓库是私有的，客户点 Release 链接只会
    # 看到 404，而资产 URL 的鉴权看的是访问者身份，不是链接本身，所以也没法
    # 把链接转发出去。公开下载走 S3 + CloudFront。
    #
    # key 里带版本号，所以**不需要** CloudFront 失效：每个版本是一组新 key，
    # 已缓存的老版本本来就不该变。karo-admin-mobile 那边每次发版都要手动
    # invalidation，是因为它的 latest manifest 用的是固定 key。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, installer-windows]
    permissions:
      contents: read
      # OIDC 换临时凭据。这个仓库里没有、也不该有长期 AK/SK：
      # 账号 675046263436 的 karo-mcms-github-actions 角色信任
      # repo:nimysan/*:*，本仓库已经在范围内。
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-hub-*
          merge-multiple: true
          path: dist/pkg

      - name: 取临时凭据
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 角色 ARN 带账号号，放仓库变量而不是写进文件。
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: mcp-hub-publish-${{ github.run_id }}

      - name: 上传到 S3
        env:
          # 桶挂在 CloudFront E1S139XADZ4HWZ(pub.itheone.org)后面，
          # origin path 是 /static，所以 key 的 static/ 这一层在 URL 里不出现。
          BUCKET: karo-media-contents
          PREFIX: static/mcp-hub
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          ls -l dist/pkg

          # 断言产物齐全。少传一个平台比传错更难发现：下载页看起来正常，
          # 只有用那个平台的客户打不开。
          for f in dist/pkg/*.zip dist/pkg/*.exe dist/pkg/SHA256SUMS.txt; do
            test -s "$f" || { echo "::error::缺少产物 $f"; exit 1; }
          done

          # 版本化的 key 是不可变的，所以可以让 CDN 长期缓存。
          aws s3 cp dist/pkg/ "s3://${BUCKET}/${PREFIX}/${TAG}/" \
            --recursive \
            --exclude "*" \
            --include "*.zip" \
            --include "*.exe" \
            --include "SHA256SUMS*.txt" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

          # 刻意不用 aws s3 ls 校验：那要 s3:ListBucket，而这个 OIDC 角色只有写权限，
          # 所以 v0.1.5 那次 8 个文件全传上去了、却因为那一行报了整步失败
          # （AccessDenied ListObjectsV2），连带下面的下载地址摘要被跳过。
          #
          # 而且要验的本来就不是「S3 里有这个 key」，是「客户点那个链接下得到东西」----
          # 走公开地址把 CloudFront 那一段也一起验了（origin path、OAC 权限配错时
          # S3 里有文件但链接是 403/404，aws s3 ls 看不见这类故障），还不需要任何 AWS 权限。
          echo "== 公开地址实测 =="
          for f in dist/pkg/*.exe dist/pkg/*.zip dist/pkg/SHA256SUMS*.txt; do
            n="$(basename "$f")"
            u="https://pub.itheone.org/mcp-hub/${TAG}/${n}"
            code=""
            # 首次请求要回源取对象，偶尔会慢或抖，所以重试几次再判失败。
            for i in 1 2 3 4 5; do
              code="$(curl -sS -o /dev/null -I -w '%{http_code}' "$u" || echo 000)"
              [ "$code" = "200" ] && break
              echo "  重试 ${i}：${n} 返回 ${code}"
              sleep 3
            done
            if [ "$code" != "200" ]; then
              echo "::error::${u} 返回 ${code} ---- S3 已写入但公开地址取不到，检查 CloudFront(E1S139XADZ4HWZ) 的 origin path 与 OAC 权限"
              exit 1
            fi
            echo "  200  ${n}"
          done

      - name: 写下载地址到任务摘要
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          BASE="https://pub.itheone.org/mcp-hub/${TAG}"
          {
            echo "## ${TAG} 下载地址"
            echo
            for f in dist/pkg/*.exe dist/pkg/*.zip; do
              n=$(basename "$f")
              echo "- [${n}](${BASE}/${n})"
            done
          } >> "$GITHUB_STEP_SUMMARY"

# 刻意没有「发布 GitHub Release」这个 job：客户拿到的是 pub.itheone.org 上的
# 公开地址，Release 页面没人看，而它需要 contents: write（整个流水线唯一
# 要写仓库的权限）并且产出一个要人去手动点发布的草稿。要加回来之前，
# 先问清楚谁会去那个页面下载。
