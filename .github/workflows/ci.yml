# 三平台构建与测试。
#
# 为什么要三个平台的 runner：**构建**其实不需要 —— 全程 CGO_ENABLED=0 的纯 Go，
# 一台 Linux 就能交叉编译出全部五个目标。三个 runner 要解决的是另外三件事：
#
#   1. 在每个操作系统上真的跑一遍测试（凭据后端、路径、UserConfigDir 的基准
#      目录三者在三个平台上完全不同，只在 macOS 上绿不说明 Windows 上能用）
#   2. 以后做原生安装包（MSI 要 Windows，dmg / pkg 要 macOS）
#   3. 以后做代码签名（Windows 签名和 Apple 公证都必须在对应平台上做）
#
# 所以这里的分工是：test 用三平台矩阵，build 只在 Linux 上做交叉编译。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不打断其他平台：三个平台的失败往往互相独立，
      # 一次就把三份结果都看到比逐个试快得多。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # wasm 插件的测试要先有模块。这一步不用 plugins/build.sh：那是个
      # bash 脚本，在 Windows runner 上要靠 Git Bash 和 du，没必要赌。
      - name: 构建 wasm 插件模块
        shell: bash
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          mkdir -p plugins/dist/ghwasm
          go build -buildmode=c-shared -o plugins/dist/ghwasm/ghwasm.wasm ./plugins/ghwasm

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      # 只在 Linux 上查：格式是平台无关的，跑三遍纯属浪费。而且它必须排在
      # 测试**后面** —— 这一步失败过一次，把 Windows 上的测试整个挡掉了，
      # 结果是「Windows 红了，但我们不知道测试本身能不能过」。
      - name: gofmt 检查
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "下面这些文件没有 gofmt 过："
            echo "$unformatted"
            exit 1
          fi

  build:
    name: 交叉编译五平台
    runs-on: ubuntu-latest
    needs: test
    # 日常开发只跑测试。交叉编译 + 打包要 4 分钟，而它们在非 tag 构建上产出的
    # 版本号是 0.0.0-dev+<sha>，谁也不会拿去用 —— 为一堆没人下载的产物等 4 分钟
    # 不值得。
    #
    # 代价是 Inno Setup 的安装包脚本没有任何测试覆盖（测试矩阵三平台只编译宿主
    # 架构），改了 packaging/ 之后要到打 tag 那一刻才知道坏没坏。所以保留
    # workflow_dispatch：手动跑一次就是发布前演练，跑 ①②③ 而不发布
    # （④⑤ 另有 tag 判断）。改 packaging/ 之后请先手动跑一次再打 tag。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tag 推上来就用 tag 名当版本号，其他情况用 0.0.0-dev+<短 sha>，
      # 这样从任何一个产物都能倒推出它是哪次提交。
      - name: 确定版本号
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # release.sh 默认用 goproxy.cn —— 那是为开发机准备的（本机到
      # proxy.golang.org 的 DNS 不通）。CI 上走官方的。
      - name: 打发布包
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: VERSION="${{ steps.ver.outputs.version }}" ./packaging/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-hub-${{ steps.ver.outputs.version }}
          path: |
            dist/pkg/*.zip
            dist/pkg/SHA256SUMS.txt
          retention-days: 30

  installer-windows:
    name: Windows 安装包
    runs-on: windows-latest
    needs: build
    # 和 build 同一个条件：它 needs build，build 被跳过时它本来也不会跑，
    # 但写出来才看得懂「日常构建为什么没有安装包」。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      # 用 build 这一步的产物，而不是在这台 runner 上重新编译 —— 这样
      # zip 里的 exe 和安装包里的 exe 是同一个二进制，排查问题时不用怀疑
      # 「这两个是不是同一次构建」。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-hub-*
          merge-multiple: true
          path: artifacts

      - name: 解出 Windows amd64 的内容
        shell: bash
        run: |
          mkdir -p stage
          zip=$(ls artifacts/mcp-hub-*-windows-amd64.zip)
          unzip -q "$zip" -d unpacked
          # zip 里是 mcp-hub-<版本>-windows-amd64/ 这一层目录
          cp unpacked/*/mcp-hub.exe stage/
          cp unpacked/*/快速开始.md stage/
          # 许可与归属声明：从 zip 里取，而不是从 checkout 里取 —— 这样
          # 安装包装进去的和 zip 里分发的是同一份文件。缺了会让 iscc 失败，
          # 那正是想要的：分发缺许可证是合规问题，不该静默通过。
          cp unpacked/*/LICENSE unpacked/*/NOTICE unpacked/*/THIRD-PARTY-NOTICES.md stage/
          ls -l stage

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          zip=$(ls artifacts/mcp-hub-*-windows-amd64.zip)
          base=$(basename "$zip" -windows-amd64.zip)
          version=${base#mcp-hub-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # VersionInfoVersion 必须是 x.x.x.x 的纯数字形式，
          # 而 dev 构建的版本号形如 0.0.0-dev+abc1234，塞不进去。
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "verinfo=${version}.0" >> "$GITHUB_OUTPUT"
          else
            echo "verinfo=0.0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: 装 Inno Setup
        run: choco install innosetup --no-progress -y

      # Inno Setup 自带的语言包里**没有简体中文** —— 它在 issrc 仓库里单独
      # 放着，不随安装程序分发。不取这个文件，安装包就只能是英文界面，而
      # 用户是中文办公环境里的财务和运营。
      #
      # 取不到就让这一步失败，不要静默退回英文：那样中文用户会拿到一个英文
      # 安装包，而没有人会发现。
      - name: 取简体中文语言包
        shell: bash
        run: |
          dest="/c/Program Files (x86)/Inno Setup 6/Languages/ChineseSimplified.isl"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" \
            -o "$dest"
          head -1 "$dest"
          test -s "$dest"

      - name: 编译安装包
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DAppVersion=${{ steps.ver.outputs.version }} ^
            /DVersionInfo=${{ steps.ver.outputs.verinfo }} ^
            /DSourceDir=%CD%\stage ^
            packaging\windows\mcp-hub.iss

      - name: 校验和
        shell: bash
        run: |
          cd stage/out
          sha256sum ./*.exe > SHA256SUMS-setup.txt
          cat SHA256SUMS-setup.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-hub-setup-${{ steps.ver.outputs.version }}
          path: |
            stage/out/*.exe
            stage/out/SHA256SUMS-setup.txt
          retention-days: 30

  publish-release:
    name: 发布 GitHub Release
    # 版本的事实来源就是这个 tag 和它的 Release 资产，不再往 S3/CDN 传一份。
    #
    # 幂等：同一个 tag 重跑（重新触发流水线、或补传产物）不会失败 ----
    # Release 已存在就 upload --clobber 覆盖资产，而不是报「already exists」。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, installer-windows]
    permissions:
      # 整条流水线唯一要写仓库的权限：建 Release、上传资产。
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-hub-*
          merge-multiple: true
          path: dist/pkg

      - name: 断言产物齐全
        # 少一个平台比传错更难发现：下载页看起来正常，只有用那个平台的客户打不开。
        run: |
          set -euo pipefail
          ls -l dist/pkg
          for f in dist/pkg/*.zip dist/pkg/*.exe dist/pkg/SHA256SUMS.txt dist/pkg/SHA256SUMS-setup.txt; do
            test -s "$f" || { echo "::error::缺少产物 $f"; exit 1; }
          done
          for t in windows-amd64 windows-arm64 darwin-arm64 darwin-amd64 linux-amd64; do
            ls dist/pkg/*-"${t}".zip >/dev/null 2>&1 || { echo "::error::缺少 ${t} 的发布包"; exit 1; }
          done

      - name: 建 Release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 不 checkout（只要产物），所以没有 .git。gh 默认从 git remote
          # 推断仓库，没有仓库上下文时直接报 "not a git repository" 退出 1。
          # GH_REPO 显式给出仓库，省掉一次克隆。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"

          {
            echo "## 下载"
            echo
            echo "| 系统 | 文件 |"
            echo "|---|---|"
            echo "| Windows（安装包，推荐） | \`mcp-hub-${VER}-windows-amd64-setup.exe\` |"
            echo "| Windows 免安装 | \`mcp-hub-${VER}-windows-amd64.zip\` |"
            echo "| Windows ARM | \`mcp-hub-${VER}-windows-arm64.zip\` |"
            echo "| macOS（M 系列） | \`mcp-hub-${VER}-darwin-arm64.zip\` |"
            echo "| macOS（Intel） | \`mcp-hub-${VER}-darwin-amd64.zip\` |"
            echo "| Linux | \`mcp-hub-${VER}-linux-amd64.zip\` |"
            echo
            echo "校验和见 \`SHA256SUMS.txt\`（压缩包）与 \`SHA256SUMS-setup.txt\`（安装包）。"
            echo
            echo "**升级前先退出 Amazon Quick** —— Quick 以 stdio 启动的子进程占着 \`mcp-hub.exe\`，"
            echo "不退出会在安装时报文件被占用。"
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，覆盖上传资产"
            gh release upload "$TAG" dist/pkg/*.zip dist/pkg/*.exe dist/pkg/SHA256SUMS*.txt --clobber
          else
            # 不用 --verify-tag：它要在本地 git 里查这个 tag，而这个 job 没有
            # checkout。tag 存在本来就由 job 的 if 条件（refs/tags/v*）保证。
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              dist/pkg/*.zip dist/pkg/*.exe dist/pkg/SHA256SUMS*.txt
          fi

      - name: 核对资产并写任务摘要
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # 不看上一步的退出码就算完：以资产清单为准，确认 8 个文件都在。
          gh release view "$TAG" --json assets \
            -q '.assets[] | "\(.name)\t\(.size)"' | tee assets.txt
          n=$(wc -l < assets.txt | tr -d ' ')
          [ "$n" -ge 8 ] || { echo "::error::Release 资产只有 ${n} 个，少于 8"; exit 1; }

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## ${TAG} 下载地址"
            echo
            for f in dist/pkg/*.exe dist/pkg/*.zip; do
              n=$(basename "$f")
              echo "- [${n}](${BASE}/${n})"
            done
          } >> "$GITHUB_STEP_SUMMARY"

# 资产地址形如
#   https://github.com/<owner>/<repo>/releases/download/<tag>/<文件名>
# 私有仓库的这个地址要访问者有仓库权限，所以它不是一个可以转发给外部客户的
# 公开链接。仓库转公开后即为公开可下载。
